<body class="bg-light text-slate-800 dark:bg-dark dark:text-slate-200 font-sans">

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 pt-24 pb-20 fade-in-up">
        <!-- 个人简介 -->
        <div class="py-8">
            <div class="flex flex-wrap gap-8 lg:gap-16 items-center">
                <div class="relative flex-shrink-0 w-full sm:w-64 lg:w-72 mb-8 sm:mb-0" id="about-photos">
                    <div class="absolute -inset-4 bg-gradient-to-r from-primary to-secondary rounded-2xl opacity-30 blur-lg" id="about-photos-glow"></div>
                    <img id="about-work-photo" alt="工作照" class="relative w-full sm:w-64 lg:w-72 aspect-[4/5] rounded-2xl shadow-2xl object-cover" style="display:none;">
                </div>
                <div class="flex-1 min-w-[300px]">
                    <h1 class="text-4xl font-extrabold mb-2" id="about-name">禾安</h1>
                    <p class="text-primary text-lg font-medium mb-4" id="about-title"></p>
                    <div class="text-base text-slate-600 dark:text-slate-400 mb-4 leading-relaxed" id="about-intro"></div>
                    <div class="flex flex-wrap gap-3 mb-4" id="about-links"></div>
                    <!-- 技术栈标签 -->
                    <div id="about-tech-section" style="display:none;">
                        <h3 class="font-semibold text-lg mb-2">技术栈</h3>
                        <div class="flex flex-wrap gap-2" id="about-tech-tags"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 工作经历 -->
        <section class="py-12 border-t border-slate-200 dark:border-slate-700" id="about-experiences-section">
            <h2 class="text-2xl font-bold mb-8 flex items-center"><i class="fas fa-briefcase text-primary mr-3"></i>工作经历</h2>
            <div class="space-y-8" id="about-experiences"></div>
        </section>

        <!-- 服务内容 -->
        <section class="py-12 border-t border-slate-200 dark:border-slate-700" id="about-services-section">
            <h2 class="text-2xl font-bold mb-8 flex items-center"><i class="fas fa-handshake text-primary mr-3"></i>服务内容</h2>
            <div class="grid md:grid-cols-3 gap-6" id="about-services"></div>
        </section>

        <!-- 联系我 -->
        <section class="py-12 border-t border-slate-200 dark:border-slate-700" id="about-cta-section">
            <h2 class="text-2xl font-bold mb-2 text-center">有项目想法或技术问题？</h2>
            <p class="text-slate-600 dark:text-slate-400 mb-8 text-center">欢迎聊聊，一起探讨技术方案与产品可能性。</p>

            <!-- 留下您的需求 -->
            <div class="max-w-xl mx-auto">
                <h3 class="text-xl font-bold mb-6 text-center">留下您的需求</h3>
                <form id="contact-form" class="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-lg border border-slate-100 dark:border-slate-700 space-y-5" onsubmit="event.preventDefault(); handleContactSubmit();">
                    <div>
                        <label class="block text-sm font-medium mb-1">您的称呼</label>
                        <input type="text" id="contact-name" placeholder="怎么称呼您" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent focus:ring-2 focus:ring-primary outline-none transition-colors" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">您的联系方式</label>
                        <input type="text" id="contact-info" placeholder="请填写邮箱或微信号，方便我联系您" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent focus:ring-2 focus:ring-primary outline-none transition-colors" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">需求描述</label>
                        <textarea id="contact-content" rows="4" placeholder="简单描述您的项目需求、预算范围和期望时间..." class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent focus:ring-2 focus:ring-primary outline-none transition-colors resize-none" required></textarea>
                    </div>
                    <div id="contact-type-wrap">
                        <label class="block text-sm font-medium mb-1">合作类型</label>
                        <select id="contact-type" class="custom-select w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent focus:ring-2 focus:ring-primary outline-none transition-colors">
                            <option value="">请选择合作类型</option>
                        </select>
                    </div>
                    <button type="submit" id="contact-submit-btn" class="w-full py-3 rounded-lg bg-primary text-white font-medium hover:bg-blue-600 transition-colors shadow-lg hover:shadow-blue-500/30">
                        <i class="fas fa-paper-plane mr-2"></i>提交意向
                    </button>
                    <div id="submit-success" class="hidden text-center py-3 rounded-lg bg-green-50 dark:bg-green-900/20 text-green-700 dark:text-green-400 text-sm">
                        <i class="fas fa-check-circle mr-1"></i> 意向已收到，我会尽快回复您！
                    </div>
                    <div id="submit-error" class="hidden text-center py-3 rounded-lg bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-400 text-sm">
                        <i class="fas fa-exclamation-circle mr-1"></i> <span id="submit-error-msg">发送失败，请稍后重试</span>
                    </div>
                </form>
            </div>

            <!-- 分割线 -->
            <div class="border-t border-slate-200 dark:border-slate-700 my-12"></div>

            <!-- 关注公众号 -->
            <div class="max-w-xl mx-auto" id="public-account-section">
                <h3 class="text-xl font-bold mb-6 text-center" id="pa-title" style="display:none;">关注公众号</h3>
                <div class="text-center" id="pa-content"></div>
            </div>
        </section>

    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-12">
        <!-- ⚠️ 无 JS 时的静态回退（站点名 + 备案号）：爬虫不执行 JS，必须静态可读 ✓
             JS 加载后由 renderFooter() 整体替换 → 真实用户看到的仍是原页脚 ✓ 内容由 gen_static.py 同步，勿手改 ✗ -->
        <div id="filing-static" class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 leading-relaxed">
            <p>禾安的笔记</p>
            <p><a href="https://beian.miit.gov.cn" rel="noopener">豫ICP备2026043016号-1</a> · <a href="https://beian.mps.gov.cn/#/query/webSearch?code=41018302000609" rel="noopener">豫公网安备41018302000609号</a></p>
        </div>
    </footer>

    <script src="../js/utils.js"></script>
    <script src="../vendor/localforage.min.js"></script>

    <script>
        initApp('about', { type: 'main' });

        async function loadAboutPage() {
            const [cfgData, profileData] = await Promise.all([
                loadBaseConfig(),
                loadProfile()
            ]);

            const cfg = (cfgData && cfgData.config) ? cfgData.config : {};
            const about = (profileData && profileData.about) ? profileData.about : {};
            if (!about.intro && !about.name) return;

            // 网站名称
            // 品牌名改由 views.js 的 applySiteName() 单点统一，这里只管页面标题
            if (cfg.site_name) {
                document.title = `关于我 | ${cfg.site_name}`;
            }

            // 个人简介
            document.getElementById('about-name').textContent = about.name || '';
            document.getElementById('about-title').textContent = about.title || '';
            document.getElementById('about-intro').innerHTML = (about.intro || '').replace(/\n/g, '<br>');
            // 工作照：仅读取后端配置 work_photo（无则隐藏图片，不再使用占位假图）
            const photosWrap = document.getElementById('about-photos');
            const wpEl = document.getElementById('about-work-photo');
            if (about.work_photo) { wpEl.src = about.work_photo; wpEl.style.display = ''; } else { wpEl.style.display = 'none'; }
            if (photosWrap) photosWrap.style.display = about.work_photo ? '' : 'none';

            // 社交链接
            const linksEl = document.getElementById('about-links');
            const contacts = about.contacts || {};
            let linksHtml = '';
            if (contacts.github) linksHtml += `<a href="https://github.com/${contacts.github}" target="_blank" class="flex items-center gap-2 px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all text-sm"><i class="fab fa-github"></i> GitHub</a>`;
            if (contacts.twitter) linksHtml += `<a href="https://twitter.com/${contacts.twitter}" target="_blank" class="flex items-center gap-2 px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all text-sm"><i class="fab fa-twitter"></i> Twitter</a>`;
            linksEl.innerHTML = linksHtml;

            // 技术栈（从 profile 读取，样式已由后端合并模板库）
            const techStacks = about.tech_stacks || [];
            const techSection = document.getElementById('about-tech-section');
            if (techStacks.length > 0) {
                document.getElementById('about-tech-tags').innerHTML = techStacks.map(t => {
                    const bg = t.bg_color || 'bg-blue-50';
                    const txt = t.text_color || 'text-blue-700';
                    const darkBg = t.dark_bg_color || 'dark:bg-blue-900/30';
                    const darkTxt = t.dark_text_color || 'dark:text-blue-400';
                    const icon = t.icon || 'fa-solid fa-code';
                    return `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-md text-sm font-medium ${bg} ${txt} ${darkBg} ${darkTxt}"><i class="${icon}"></i>${t.name || ''}</span>`;
                }).join('');
                techSection.style.display = '';
            } else {
                techSection.style.display = 'none';
            }

            // 工作经历（过滤隐藏）
            const exps = (about.experiences || []).filter(e => !e.hidden);
            const expSection = document.getElementById('about-experiences-section');
            if (exps.length > 0) {
                const colors = ['bg-primary', 'bg-secondary', 'bg-slate-400', 'bg-amber-400'];
                document.getElementById('about-experiences').innerHTML = exps.map((e, i) => `
                    <div class="flex gap-6">
                        <div class="flex-shrink-0 w-3 h-3 rounded-full ${colors[i % colors.length]} mt-2"></div>
                        <div>
                            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-1">
                                <h3 class="font-bold text-lg">${e.position}</h3>
                                <span class="text-sm text-slate-500">${e.period}</span>
                            </div>
                            <p class="text-primary text-sm font-medium mb-2">${e.company}</p>
                            <p class="text-slate-600 dark:text-slate-400 leading-relaxed">${e.description}</p>
                        </div>
                    </div>`).join('');
                expSection.style.display = '';
            } else {
                expSection.style.display = 'none';
            }

            // 服务内容（过滤隐藏）
            const services = (cfgData && cfgData.services) ? cfgData.services.filter(s => !s.hidden) : [];
            const svcSection = document.getElementById('about-services-section');
            if (services.length > 0) {
                document.getElementById('about-services').innerHTML = services.map(s => {
                    const colorClass = s.color || 'bg-blue-100';
                    return `<div class="p-6 bg-white dark:bg-slate-800 rounded-xl shadow-md border border-slate-100 dark:border-slate-700"><div class="w-12 h-12 rounded-lg ${colorClass} dark:bg-opacity-20 flex items-center justify-center mb-4"><i class="${s.icon} text-primary text-xl"></i></div><h3 class="font-bold text-lg mb-2">${s.title}</h3><p class="text-slate-600 dark:text-slate-400 text-sm leading-relaxed">${s.description}</p></div>`;
                }).join('');
                svcSection.style.display = '';
            } else {
                svcSection.style.display = 'none';
            }

            // 合作类型下拉填充：无已发布的服务内容时，整块隐藏
            const typeWrap = document.getElementById('contact-type-wrap');
            const selectEl = document.getElementById('contact-type');
            if (services.length > 0) {
                selectEl.innerHTML = '<option value="">请选择合作类型</option>' +
                    services.map(s => `<option value="${s.id}">${s.title}</option>`).join('');
            } else {
                typeWrap.style.display = 'none';
            }

            // 公众号模块
            const paTitle = document.getElementById('pa-title');
            const paContent = document.getElementById('pa-content');
            if (contacts.mp_qrcode) {
                paTitle.style.display = '';
                paContent.innerHTML = `
                    <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">获取独家技术资料、源码下载权限及最新独立开发咨询</p>
                    <div class="w-56 h-56 bg-slate-100 dark:bg-slate-700 rounded-lg overflow-hidden mx-auto">
                        <img src="${contacts.mp_qrcode}" alt="公众号二维码" class="w-full h-full object-cover">
                    </div>
                    ${contacts.mp_name ? '<p class="mt-4 text-slate-700 dark:text-slate-300 font-bold">扫码关注「' + contacts.mp_name + '」</p>' : ''}
                    <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">回复"资料"获取独家技术资料</p>
                `;
            } else {
                paTitle.style.display = 'none';
                paContent.innerHTML = '';
            }

            // 页脚链接
            renderFooter(contacts);

            // URL hash 定位到联系我模块
            if (location.hash === '#about-cta-section') {
                setTimeout(() => {
                    const el = document.getElementById('about-cta-section');
                    if (el) el.scrollIntoView({ behavior: 'smooth' });
                }, 300);
            }
        }
        // loadAboutPage 为 async：await 并捕获异常
        (async () => {
            try {
                await loadAboutPage();
            } catch (e) {
                console.error('[about] 加载失败:', e);
            }
        })();

        async function handleContactSubmit() {
            const name = document.getElementById('contact-name').value.trim();
            const contact = document.getElementById('contact-info').value.trim();
            const content = document.getElementById('contact-content').value.trim();
            const cooperationType = document.getElementById('contact-type').value;

            if (!name || !contact || !content) return;

            const btn = document.getElementById('contact-submit-btn');
            const successEl = document.getElementById('submit-success');
            const errorEl = document.getElementById('submit-error');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>发送中...';
            successEl.classList.add('hidden');
            errorEl.classList.add('hidden');

            const result = await sendContactEmail({
                name,
                contact,
                content,
                cooperation_type: cooperationType,
            });

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i>提交意向';

            if (result.success) {
                successEl.classList.remove('hidden');
                document.getElementById('contact-form').reset();
            } else {
                document.getElementById('submit-error-msg').textContent = result.message || '发送失败，请稍后重试';
                errorEl.classList.remove('hidden');
            }
        }
    </script>
    <!-- 百度「自动推送」：页面被访问时自动把 URL 推送给百度，加速收录 -->
    <script>
    (function () {
        var bp = document.createElement('script');
        var protocol = window.location.protocol.split(':')[0];
        // https 与 http 使用不同的推送地址（官方要求）
        bp.src = protocol === 'https'
            ? 'https://zz.bdstatic.com/linksubmit/push.js'
            : 'http://push.zhanzhang.baidu.com/push.js';
        var first = document.getElementsByTagName('script')[0];
        first.parentNode.insertBefore(bp, first);
    })();
    </script>
