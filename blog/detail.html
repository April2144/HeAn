<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博文详情 | 禾安</title>
    <meta name="description" content="禾安的博客文章">
    <script src="../js/config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = TAILWIND_CONFIG;
    </script>
    <!-- 暗黑模式防闪烁 -->
    <script>
        (function(){try{var t=localStorage.getItem('theme-mode')||'system';var u=new URLSearchParams(location.search).get('theme');var m=(u&&['light','dark','system'].includes(u))?u:t;var d=m==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):m;document.documentElement.classList.toggle('dark',d==='dark')}catch(e){}})();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../js/common.css?v=20260921d">
    <link rel="icon" href="/assets/logo-mark.svg">
</head>
<body class="bg-light text-slate-800 dark:bg-dark dark:text-slate-200 font-sans">

    <!-- 顶栏：由 renderNavbar 统一生成（detail 模式） -->
    <header id="navbar"></header>

    <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-28 pb-20">
        <article class="fade-in-up">
            <header class="mb-10">
                <div class="flex items-center gap-3 mb-4">
                    <span class="tag-badge" id="article-tag">分类</span>
                    <span class="text-sm text-slate-400" id="article-date">2026-06-28</span>
                    <span class="text-sm text-primary font-medium" id="article-series" style="display:none;"></span>
                </div>
                <h1 class="text-3xl md:text-4xl font-extrabold mb-6 leading-tight" id="article-title">加载中...</h1>
                <div class="flex items-center gap-3 pb-6 border-b border-slate-200 dark:border-slate-700">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary to-secondary flex items-center justify-center text-white font-bold">禾</div>
                    <div>
                        <p class="font-medium text-sm">禾安</p>
                        <p class="text-xs text-slate-500">独立开发者 · 专注移动端iOS开发</p>
                    </div>
                </div>
            </header>
            <div id="article-cover-wrap" class="rounded-2xl overflow-hidden shadow-lg mb-10">
                <img id="article-cover" src="" alt="文章封面" class="w-full object-cover">
            </div>
            <div class="article-content text-slate-700 dark:text-slate-300" id="article-body"></div>
            <!-- 文章标签 -->
            <div class="mt-10 pt-8" id="article-labels-section" style="display:none;">
                <div class="flex flex-wrap gap-2" id="article-labels"></div>
            </div>
        </article>
    </main>

    <!-- 详情页统一不显示页脚（有意为之） -->

    <script src="../vendor/localforage.min.js"></script>
    <script src="../js/api.js?v=20260921c"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/views.js?v=20260921c"></script>
    <script src="../js/seo.js?v=1"></script>
    <script src="../js/theme.js?v=20260921d"></script>
    <script src="../js/auth.js?v=20260921e"></script>
    <!-- Tiptap JSON 文档模型渲染层（正文标准渲染路径） -->
    <script src="../js/renderer.js?v=2"></script>
    <script>
        initApp('blog', { type: 'detail' });
        HeAnAuth.mountLoginButton();

        async function renderBlogDetail() {
            // 兼容两种 URL：/blog/6/（预渲染真实路径 ✓）与 /blog/detail.html?id=6（旧链接 ✓）
            const blogId = resolveContentId('blog');
            const blog = await loadBlog(blogId);
            if (!blog) return;

            // SEO：标题 + 真实摘要 + 分享卡片 + 结构化数据（统一走 seo.js 单点）✓
            // ⚠️ 原先只改了 document.title，description 还是写死的「禾安的博客文章」✗
            if (window.HeAnSeo) {
                HeAnSeo.apply({
                    title: `${blog.title} | ${siteDisplayName()}`,
                    description: blog.summary || '',
                    image: blog.cover_image || '',
                    type: 'article',
                    // 规范链接固定指向新路径 → 旧 ?id= 页也归一到它（避免重复内容 ✗）
                    url: location.origin + '/blog/' + blogId + '/',
                    jsonLd: HeAnSeo.jsonLd.article({
                        title: blog.title,
                        description: blog.summary || '',
                        image: blog.cover_image || '',
                        date: blog.date || '',
                        tags: blog.tags || [],
                    }),
                });
            } else {
                document.title = `${blog.title} | ${siteDisplayName()}`;
            }
            document.getElementById('article-title').textContent = blog.title;
            document.getElementById('article-date').textContent = blog.date;
            // 封面图：无封面时不显示占位图，仅在有封面时渲染
            const coverWrap = document.getElementById('article-cover-wrap');
            const coverEl = document.getElementById('article-cover');
            if (blog.cover_image) {
                coverEl.src = blog.cover_image;
                coverEl.alt = blog.title;
                coverWrap.style.display = '';
            } else {
                coverWrap.style.display = 'none';
            }
            document.getElementById('article-body').innerHTML = renderContent(blog.content || '');

            // 顶部：分组徽章（显示对应分组名；未分组显示「全部」）
            const articleTagEl = document.getElementById('article-tag');
            const groupLabel = (blog.group && blog.group !== '未分组') ? blog.group : '全部';
            if (TAG_MAP[blog.group]) {
                // 命中统一标签系统：沿用彩色徽章（含分组名 + 图标）
                applyGroupColor(articleTagEl, blog.group);
            } else {
                // 文件夹分组 / 未分组：中性标签，未分组显示「全部」
                articleTagEl.className = 'label-tag';
                articleTagEl.removeAttribute('style');
                articleTagEl.textContent = groupLabel;
            }

            // 系列信息（如果有系列分组标签和进度）
            const seriesEl = document.getElementById('article-series');
            if (blog.series_name && blog.series_progress) {
                seriesEl.textContent = `${blog.series_name} · ${blog.series_progress}`;
                seriesEl.style.display = '';
            } else {
                seriesEl.style.display = 'none';
            }

            // 底部：文章标签（矩形小圆角）
            const labelsHtml = getLabelsHtml(blog.tags);
            const labelsSection = document.getElementById('article-labels-section');
            if (labelsHtml) {
                document.getElementById('article-labels').innerHTML = labelsHtml;
                labelsSection.style.display = '';
            }

        }
        // 返回上级页面：根据来源智能返回，保持与专题/项目详情页一致
        function goBack() {
            const from = new URLSearchParams(location.search).get('from');
            if (from === 'home') {
                window.history.back();
            } else if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }
        (async () => {
            try {
                await initTagMapFromAPI();
                await renderBlogDetail();
            } catch (e) {
                console.error('[blog detail] 渲染失败:', e);
            }
        })();
    </script>
    <!-- 百度「自动推送」：页面被访问时自动把 URL 推送给百度，加速收录 -->
    <script>
    (function () {
        var bp = document.createElement('script');
        var protocol = window.location.protocol.split(':')[0];
        // https 与 http 使用不同的推送地址（官方要求）
        bp.src = protocol === 'https'
            ? 'https://zz.bdstatic.com/linksubmit/push.js'
            : 'http://push.zhanzhang.baidu.com/push.js';
        var first = document.getElementsByTagName('script')[0];
        first.parentNode.insertBefore(bp, first);
    })();
    </script>
</body>
</html>
