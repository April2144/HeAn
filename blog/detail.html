<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博文详情 | 禾安</title>
    <meta name="description" content="禾安的博客文章">
    <script src="../js/config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = TAILWIND_CONFIG;
    </script>
    <!-- 暗黑模式防闪烁 -->
    <script>
        (function(){try{var t=localStorage.getItem('theme-mode')||'system';var u=new URLSearchParams(location.search).get('theme');var m=(u&&['light','dark','system'].includes(u))?u:t;var d=m==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):m;document.documentElement.classList.toggle('dark',d==='dark')}catch(e){}})();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../js/common.css">
</head>
<body class="bg-light text-slate-800 dark:bg-dark dark:text-slate-200 transition-colors duration-300 font-sans">

    <!-- 详情页顶栏：面包屑(左) + 返回(右)，无主导航 -->
    <header class="sticky top-0 z-50 bg-white/80 dark:bg-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
            <nav class="flex items-center space-x-2 text-sm text-slate-500">
                <span class="text-slate-400" id="breadcrumb-from">首页</span>
                <i class="fas fa-chevron-right text-xs"></i>
                <span class="text-slate-800 dark:text-slate-200" id="breadcrumb-title">文章详情</span>
            </nav>
            <button id="btn-back" class="flex items-center gap-1.5 text-sm text-primary font-medium hover:underline">
                <i class="fas fa-arrow-left text-xs"></i> 返回
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-20">
        <article class="fade-in-up">
            <header class="mb-10">
                <div class="flex items-center gap-3 mb-4">
                    <span class="tag-badge" id="article-tag">分类</span>
                    <span class="text-sm text-slate-400" id="article-date">2026-06-28</span>
                    <span class="text-sm text-primary font-medium" id="article-series" style="display:none;"></span>
                </div>
                <h1 class="text-3xl md:text-4xl font-extrabold mb-6 leading-tight" id="article-title">加载中...</h1>
                <div class="flex items-center gap-3 pb-6 border-b border-slate-200 dark:border-slate-700">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary to-secondary flex items-center justify-center text-white font-bold">禾</div>
                    <div>
                        <p class="font-medium text-sm">禾安</p>
                        <p class="text-xs text-slate-500">独立开发者 · 专注移动端iOS开发</p>
                    </div>
                </div>
            </header>
            <div class="rounded-2xl overflow-hidden shadow-lg mb-10">
                <img id="article-cover" src="https://picsum.photos/1000/400?article" alt="文章封面" class="w-full object-cover">
            </div>
            <div class="article-content text-slate-700 dark:text-slate-300" id="article-body"></div>
            <!-- 公众号二维码 -->
            <div id="public-account-section" style="display:none;"></div>
            <!-- 文章标签 -->
            <div class="mt-10 pt-8" id="article-labels-section" style="display:none;">
                <div class="flex flex-wrap gap-2" id="article-labels"></div>
            </div>
            <!-- 上下篇导航 -->
            <div class="post-nav flex justify-between items-start gap-4" id="post-nav-section"></div>
        </article>
    </main>

    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-12"></footer>

    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/views.js"></script>
    <script src="../js/theme.js"></script>
    <script>
        // 不调用 initApp，详情页不渲染主导航栏
        initTheme();

        // 根据 from 参数决定面包屑和返回目标
        const params = new URLSearchParams(window.location.search);
        const from = params.get('from') || 'blog';
        const backUrl = from === 'home' ? '../index.html#blog' : './index.html';
        document.getElementById('breadcrumb-from').innerHTML = from === 'home'
            ? '<a href="../index.html#blog" class="hover:text-primary transition-colors"><i class="fas fa-home mr-1"></i>首页</a>'
            : '<a href="./index.html" class="hover:text-primary transition-colors">博客列表</a>';
        document.getElementById('btn-back').addEventListener('click', () => { window.location.href = backUrl; });

        async function renderBlogDetail() {
            const blogId = parseInt(params.get('id')) || 0;
            const blog = await loadBlog(blogId);
            if (!blog) return;

            document.getElementById('breadcrumb-title').textContent = blog.title;
            document.title = `${blog.title} | ${SITE.name}`;
            document.getElementById('article-title').textContent = blog.title;
            document.getElementById('article-date').textContent = blog.date;
            document.getElementById('article-cover').src = blog.cover_image;
            document.getElementById('article-cover').alt = blog.title;
            document.getElementById('article-body').innerHTML = blog.body || '';

            // 展示公众号二维码（如果 show_public_account 开启）
            const profileData = await loadProfile();
            const about = (profileData && profileData.about) ? profileData.about : null;
            const contacts = (about && about.contacts) ? about.contacts : {};
            const publicAccountSection = document.getElementById('public-account-section');
            if (publicAccountSection && blog.show_public_account && contacts && contacts.mp_qrcode) {
                publicAccountSection.innerHTML = `
                    <div class="mt-10 pt-8 border-t border-slate-200 dark:border-slate-700 text-center">
                        <h3 class="font-bold mb-4">关注公众号</h3>
                        <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">获取独家技术资料、源码下载权限及最新独立开发咨询</p>
                        <div class="w-48 h-48 bg-slate-100 dark:bg-slate-700 rounded-lg overflow-hidden mx-auto">
                            <img src="${contacts.mp_qrcode}" alt="公众号二维码" class="w-full h-full object-cover">
                        </div>
                        ${contacts.mp_name ? '<p class="mt-4 text-slate-700 dark:text-slate-300 font-bold">扫码关注「' + contacts.mp_name + '」</p>' : ''}
                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">回复"资料"获取独家技术资料</p>
                    </div>
                `;
                publicAccountSection.style.display = '';
            }

            // 顶部：分组徽章
            applyGroupColor(document.getElementById('article-tag'), blog.group || '');

            // 系列信息（如果有系列分组标签和进度）
            const seriesEl = document.getElementById('article-series');
            if (blog.series_name && blog.series_progress) {
                seriesEl.textContent = `${blog.series_name} · ${blog.series_progress}`;
                seriesEl.style.display = '';
            } else {
                seriesEl.style.display = 'none';
            }

            // 底部：文章标签（矩形小圆角）
            const labelsHtml = getLabelsHtml(blog.tags);
            const labelsSection = document.getElementById('article-labels-section');
            if (labelsHtml) {
                document.getElementById('article-labels').innerHTML = labelsHtml;
                labelsSection.style.display = '';
            }

            // 上下篇导航
            try {
                const allBlogs = await loadBlogs({ limit: 50 });
                const all = (allBlogs && allBlogs.blogs) ? allBlogs.blogs : [];
                const idx = all.findIndex(b => b.id === blogId);
                let prevHtml = '', nextHtml = '';

                if (idx > 0) {
                    const prev = all[idx - 1];
                    prevHtml = `<div><p class="post-nav-label">上一篇</p><a class="post-nav-link" href="?id=${prev.id}">${prev.title}</a></div>`;
                } else {
                    prevHtml = `<div><p class="post-nav-label">上一篇</p><span class="post-nav-disabled text-sm">已经是第一篇</span></div>`;
                }

                if (idx >= 0 && idx < all.length - 1) {
                    const next = all[idx + 1];
                    nextHtml = `<div style="text-align:right;"><p class="post-nav-label">下一篇</p><a class="post-nav-link" href="?id=${next.id}">${next.title}</a></div>`;
                } else {
                    nextHtml = `<div style="text-align:right;"><p class="post-nav-label">下一篇</p><span class="post-nav-disabled text-sm">已经是最后一篇</span></div>`;
                }

                document.getElementById('post-nav-section').innerHTML = prevHtml + nextHtml;
            } catch (e) {
                console.warn('加载文章导航失败', e);
            }
        }
        (async () => {
            await initTagMapFromAPI();
            renderBlogDetail();
        })();
    </script>
</body>
</html>
