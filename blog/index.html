<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客 | 禾安</title>
    <meta name="description" content="禾安的博客 - 技术博客、商业洞察、个人思考">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        dark: '#0F172A',
                        light: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        .dark ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        .fade-in-up { animation: fadeInUp 0.6s ease-out forwards; opacity: 0; transform: translateY(20px); }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        .glass-effect { background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); }
        .dark .glass-effect { background: rgba(15,23,42,0.7); }
        .tag-btn.active { background-color: #3B82F6; color: white; }
        .dark .tag-btn.active { background-color: #3B82F6; color: white; }
    </style>
</head>
<body class="bg-light text-slate-800 dark:bg-dark dark:text-slate-200 transition-colors duration-300 font-sans">

    <!-- 导航栏 -->
    <nav class="fixed w-full z-50 glass-effect border-b border-slate-200 dark:border-slate-800 transition-all duration-300" id="navbar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="../index.html" class="flex-shrink-0 flex items-center">
                    <i class="fa-solid fa-code text-primary text-2xl mr-2"></i>
                    <span class="font-bold text-xl tracking-tight">禾安</span>
                </a>
                <div class="hidden md:flex space-x-8">
                    <a href="../index.html" class="hover:text-primary transition-colors">首页</a>
                    <a href="../index.html#about" class="hover:text-primary transition-colors">关于我</a>
                    <a href="../index.html#projects" class="hover:text-primary transition-colors">项目作品</a>
                    <a href="../blog/index.html" class="text-primary font-medium transition-colors">博客</a>
                    <a href="../index.html#contact" class="hover:text-primary transition-colors">联系合作</a>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="theme-toggle" class="p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                        <i class="fas fa-moon dark:hidden"></i>
                        <i class="fas fa-sun hidden dark:block text-yellow-400"></i>
                    </button>
                    <a href="https://github.com" target="_blank" class="text-slate-600 dark:text-slate-400 hover:text-primary dark:hover:text-primary transition-colors">
                        <i class="fab fa-github text-xl"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 面包屑 -->
    <div class="pt-20 pb-4 px-4 max-w-7xl mx-auto">
        <nav class="flex items-center space-x-2 text-sm text-slate-500">
            <a href="../index.html" class="hover:text-primary transition-colors"><i class="fas fa-home"></i> 首页</a>
            <i class="fas fa-chevron-right text-xs"></i>
            <span class="text-slate-800 dark:text-slate-200">博客</span>
        </nav>
    </div>

    <!-- 博客列表 -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 pb-20">
        <div class="fade-in-up">
            <!-- 页头 -->
            <div class="text-center mb-12 pt-6">
                <h1 class="text-4xl font-extrabold mb-4">博客文章</h1>
                <p class="text-lg text-slate-600 dark:text-slate-400">记录技术成长、商业思考与个人感悟</p>
            </div>

            <!-- 标签筛选 -->
            <div class="flex flex-wrap justify-center gap-3 mb-12" id="tag-filters">
                <button class="tag-btn active px-4 py-2 rounded-full text-sm font-medium border border-slate-300 dark:border-slate-600 hover:border-primary transition-all" data-tag="all">
                    <i class="fas fa-th-large mr-1"></i> 全部
                </button>
                <button class="tag-btn px-4 py-2 rounded-full text-sm font-medium border border-slate-300 dark:border-slate-600 hover:border-primary transition-all bg-white dark:bg-slate-800" data-tag="技术博客">
                    <i class="fas fa-code mr-1"></i> 技术博客
                </button>
                <button class="tag-btn px-4 py-2 rounded-full text-sm font-medium border border-slate-300 dark:border-slate-600 hover:border-primary transition-all bg-white dark:bg-slate-800" data-tag="商业洞察">
                    <i class="fas fa-chart-line mr-1"></i> 商业洞察
                </button>
                <button class="tag-btn px-4 py-2 rounded-full text-sm font-medium border border-slate-300 dark:border-slate-600 hover:border-primary transition-all bg-white dark:bg-slate-800" data-tag="个人思考">
                    <i class="fas fa-lightbulb mr-1"></i> 个人思考
                </button>
            </div>

            <!-- 文章列表 -->
            <div class="space-y-6" id="blog-list"></div>

            <!-- 空状态 -->
            <div class="hidden text-center py-16" id="empty-state">
                <i class="fas fa-folder-open text-4xl text-slate-300 dark:text-slate-600 mb-4"></i>
                <p class="text-slate-500">暂无该分类的文章</p>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-12">
        <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center">
            <div class="mb-4 md:mb-0">
                <a href="../index.html" class="font-bold text-lg">禾安</a>
                <p class="text-sm text-slate-500 mt-1">&copy; 2026 All rights reserved.</p>
            </div>
            <div class="flex space-x-6">
                <a href="#" class="text-slate-400 hover:text-primary"><i class="fab fa-twitter"></i></a>
                <a href="#" class="text-slate-400 hover:text-primary"><i class="fab fa-github"></i></a>
                <a href="#" class="text-slate-400 hover:text-primary"><i class="fab fa-weixin"></i></a>
                <a href="#" class="text-slate-400 hover:text-primary"><i class="fas fa-envelope"></i></a>
            </div>
        </div>
    </footer>

    <script>
        // 标签 → 子文件夹映射
        const tagFolderMap = {
            '技术博客': 'tech',
            '商业洞察': 'business',
            '个人思考': 'thoughts'
        };

        const tagColors = {
            '技术博客': 'bg-blue-100 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400',
            '商业洞察': 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400',
            '个人思考': 'bg-purple-100 text-purple-600 dark:bg-purple-900/30 dark:text-purple-400'
        };
        const tagIcons = { '技术博客': 'fa-code', '商业洞察': 'fa-chart-line', '个人思考': 'fa-lightbulb' };

        let blogsData = [];

        function renderBlogs(filter = 'all') {
            const blogList = document.getElementById('blog-list');
            const emptyState = document.getElementById('empty-state');
            const filtered = filter === 'all' ? blogsData : blogsData.filter(b => b.tag === filter);

            if (filtered.length === 0) { blogList.innerHTML = ''; emptyState.classList.remove('hidden'); return; }
            emptyState.classList.add('hidden');

            blogList.innerHTML = filtered.map(blog => {
                const folder = tagFolderMap[blog.tag] || '';
                const detailPath = folder ? `${folder}/detail.html?id=${blog.id}` : `detail.html?id=${blog.id}`;
                return `
                <a href="${detailPath}" class="block group">
                    <article class="bg-white dark:bg-slate-800 rounded-xl p-6 md:p-8 shadow-md hover:shadow-xl transition-all border border-slate-100 dark:border-slate-700">
                        <div class="flex flex-col md:flex-row md:items-start gap-4">
                            <div class="flex-1">
                                <div class="flex items-center gap-3 mb-3">
                                    <span class="text-xs font-semibold px-2.5 py-1 ${tagColors[blog.tag]} rounded-full">
                                        <i class="fas ${tagIcons[blog.tag]} mr-1"></i>${blog.tag}
                                    </span>
                                    <span class="text-sm text-slate-400">${blog.date}</span>
                                </div>
                                <h2 class="text-xl md:text-2xl font-bold mb-3 group-hover:text-primary transition-colors">${blog.title}</h2>
                                <p class="text-slate-600 dark:text-slate-400 text-sm leading-relaxed mb-4">${blog.summary}</p>
                                <span class="inline-flex items-center text-primary text-sm font-medium group-hover:underline">
                                    阅读全文 <i class="fas fa-arrow-right ml-2 text-xs group-hover:translate-x-1 transition-transform"></i>
                                </span>
                            </div>
                            <div class="hidden md:block flex-shrink-0 w-28 h-28 rounded-lg overflow-hidden">
                                <img src="https://picsum.photos/200/200?blog${blog.id}" alt="${blog.title}" class="w-full h-full object-cover">
                            </div>
                        </div>
                    </article>
                </a>`;
            }).join('');
        }

        document.querySelectorAll('.tag-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tag-btn').forEach(b => { b.classList.remove('active'); b.classList.add('bg-white', 'dark:bg-slate-800'); });
                btn.classList.add('active'); btn.classList.remove('bg-white', 'dark:bg-slate-800');
                renderBlogs(btn.dataset.tag);
            });
        });

        // 从 JSON 加载数据
        async function loadBlogs() {
            try {
                const res = await fetch('../data/blogs.json');
                const data = await res.json();
                blogsData = data.blogs;
                renderBlogs();
            } catch (err) {
                console.error('加载博客数据失败:', err);
            }
        }
        loadBlogs();

        // 暗黑模式
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) { html.classList.add('dark'); }
        themeToggle.addEventListener('click', () => { html.classList.toggle('dark'); localStorage.theme = html.classList.contains('dark') ? 'dark' : 'light'; });
        window.addEventListener('scroll', () => { const navbar = document.getElementById('navbar'); navbar.classList.toggle('shadow-md', window.scrollY > 20); });
    </script>
</body>
</html>
