<head>

    <meta property="og:url" content="https://hacore.cn/blog/">

    <meta name="twitter:description" content="禾安的博客 - 技术博客、商业洞察、个人思考">
    <meta name="twitter:image" content="https://hacore.cn/assets/img/og-cover.png">
    <!-- 暗黑模式防闪烁 -->
    <script>
        (function(){try{var t=localStorage.getItem('theme-mode')||'system';var u=new URLSearchParams(location.search).get('theme');var m=(u&&['light','dark','system'].includes(u))?u:t;var d=m==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):m;document.documentElement.classList.toggle('dark',d==='dark')}catch(e){}})();
    </script>
    <script src="../js/config.js"></script>

    <script>
        tailwind.config = TAILWIND_CONFIG;
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="icon" href="/assets/logo-mark.svg">
</head>
<body class="bg-light text-slate-800 dark:bg-dark dark:text-slate-200 font-sans">

    <!-- 导航栏：由 renderNavbar 统一生成 -->
    <nav id="navbar"></nav>

    <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-24 pb-20">
        <div class="fade-in-up flex flex-col md:flex-row gap-8">
            <!-- 左侧分类导航（动态生成，只展示有数据的分组） -->
            <aside class="flex-shrink-0 w-full md:w-44">
                <nav class="md:sticky md:top-24 flex flex-wrap justify-center md:flex-col md:justify-start gap-2" id="blog-sidebar">
                    <button class="blog-side-btn filter-selected w-full text-left flex items-center gap-2" data-tag="all"><i class="fas fa-border-all text-xs"></i>全部</button>
                </nav>
            </aside>

            <!-- 右侧文章列表 -->
            <div class="flex-1">
                <div class="space-y-6" id="blog-list"></div>
                <div class="hidden text-center py-16" id="empty-state">
                    <i class="fas fa-folder-open text-4xl text-slate-300 dark:text-slate-600 mb-4"></i>
                    <p class="text-slate-500">暂无该分类的文章</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-12">
        <!-- ⚠️ 无 JS 时的静态回退（站点名 + 备案号）：爬虫不执行 JS，必须静态可读 ✓
             JS 加载后由 renderFooter() 整体替换 → 真实用户看到的仍是原页脚 ✓ 内容由 gen_static.py 同步，勿手改 ✗ -->
        <div id="filing-static" class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 leading-relaxed">
            <p>禾安的笔记</p>
            <p><a href="https://beian.miit.gov.cn" rel="noopener">豫ICP备2026043016号</a> · <a href="https://beian.mps.gov.cn/#/query/webSearch?code=41018302000609" rel="noopener">豫公网安备41018302000609号</a></p>
        </div>
    </footer>

    <script src="../vendor/localforage.min.js"></script>
    <script src="../js/api.js?v=20260921c"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/views.js?v=20260921c"></script>
    <script src="../js/theme.js?v=20260921d"></script>
    <script src="../js/auth.js?v=20260921e"></script>
    <script>
        initApp('blog', { type: 'main' });
        let blogsData = [];

        function renderBlogs(filter = 'all') {
            const blogList = document.getElementById('blog-list');
            const emptyState = document.getElementById('empty-state');
            // 按发布时间倒序（组内、跨组一致）：最新发布的排最上面。
            // date 形如 YYYY-MM-DD，字典序即时间序；缺失时回退 published_at / created_at。
            const dateKey = (b) => (b.date || b.published_at || b.created_at || '').slice(0, 10);
            const filtered = (filter === 'all' ? blogsData : blogsData.filter(b => b.group === filter))
                .slice()
                .sort((a, b) => dateKey(b).localeCompare(dateKey(a)));
            if (filtered.length === 0) { blogList.innerHTML = ''; emptyState.classList.remove('hidden'); return; }
            emptyState.classList.add('hidden');
            blogList.innerHTML = filtered.map(blog => `
                <a href="${blog.id}/?from=blog" class="block group">
                    <article class="card-hover bg-white dark:bg-slate-800 p-6 md:p-8 border border-slate-100 dark:border-slate-700">
                        <div class="flex flex-col md:flex-row md:items-start gap-4">
                            <div class="flex-1">
                                <div class="flex items-center gap-3 mb-3">
                                    ${getCardTagHtml(blog.group, blog.tags)}
                                    <span class="text-sm text-slate-400">${blog.date}</span>
                                </div>
                                <h2 class="text-xl md:text-2xl font-bold mb-3 group-hover:text-primary transition-theme-color">${blog.title}</h2>
                                <p class="text-slate-600 dark:text-slate-400 text-sm leading-relaxed mb-4">${blog.summary}</p>
                                <span class="inline-flex items-center text-primary text-sm font-medium group-hover:underline">
                                    阅读全文 <i class="fas fa-arrow-right ml-2 text-xs group-hover:translate-x-1 transition-transform"></i>
                                </span>
                            </div>
                            ${blog.cover_image ? '<div class="hidden md:block flex-shrink-0 w-28 h-28 rounded-lg overflow-hidden"><img src="' + blog.cover_image + '" alt="' + blog.title + '" class="w-full h-full object-cover"></div>' : ''}
                        </div>
                    </article>
                </a>`).join('');
        }

        async function fetchBlogs() {
            const data = await loadBlogs();
            if (!data) return;
            blogsData = data.blogs;

            // 完全没有博客数据：渲染整页空态，隐藏分类侧边栏与筛选空态（与专题页空态样式布局保持一致）
            if (blogsData.length === 0) {
                const sidebarNav = document.getElementById('blog-sidebar');
                const sidebar = sidebarNav ? sidebarNav.closest('aside') : null;
                if (sidebar) sidebar.style.display = 'none';
                const emptyState = document.getElementById('empty-state');
                if (emptyState) emptyState.style.display = 'none';
                const blogList = document.getElementById('blog-list');
                if (blogList) {
                    renderPageEmptyState(blogList, {
                        icon: 'fa-pen-nib',
                        title: '暂无博客内容',
                        description: '博客内容正在筹备中，敬请期待。',
                        links: [
                            { href: navHref('topics/index.html'), label: '专题' },
                            { href: navHref('projects/index.html'), label: '产品' },
                        ],
                    });
                }
                return;
            }

            // 侧边栏：从博客数据动态生成分组按钮
            const sidebar = document.getElementById('blog-sidebar');
            // "全部"按钮绑定点击事件
            const allBtn = sidebar.querySelector('[data-tag="all"]');
            if (allBtn) {
                allBtn.addEventListener('click', () => {
                    document.querySelectorAll('.blog-side-btn').forEach(b => b.classList.remove('filter-selected'));
                    allBtn.classList.add('filter-selected');
                    renderBlogs('all');
                });
            }
            // 从博客数据提取分组（保持后端返回顺序）
            const seenGroups = new Set();
            const dynamicGroups = [];
            blogsData.forEach(b => {
                // 未分组文章只在「全部」中展示，不单独生成分类按钮
                if (b.group && b.group !== '未分组' && !seenGroups.has(b.group)) {
                    seenGroups.add(b.group);
                    dynamicGroups.push(b.group);
                }
            });
            const groupIcons = { '技术分析': 'fa-code', '商业洞察': 'fa-chart-line', '个人思考': 'fa-lightbulb' };
            dynamicGroups.forEach(group => {
                const icon = groupIcons[group] || 'fa-tag';
                const btn = document.createElement('button');
                btn.className = 'blog-side-btn w-full text-left flex items-center gap-2';
                btn.dataset.tag = group;
                btn.innerHTML = `<i class="fas ${icon} text-xs"></i>${group}`;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.blog-side-btn').forEach(b => b.classList.remove('filter-selected'));
                    btn.classList.add('filter-selected');
                    renderBlogs(group);
                });
                sidebar.appendChild(btn);
            });

            renderBlogs();
        }
        (async () => {
            try {
                await initTagMapFromAPI();
                // fetchBlogs 内部已 await 数据后再渲染，此处需 await 以捕获异常
                await fetchBlogs();
            } catch (e) {
                console.error('[blog] 初始化失败:', e);
            }
        })();
    </script>
    <!-- 百度「自动推送」：页面被访问时自动把 URL 推送给百度，加速收录 -->
    <script>
    (function () {
        var bp = document.createElement('script');
        var protocol = window.location.protocol.split(':')[0];
        // https 与 http 使用不同的推送地址（官方要求）
        bp.src = protocol === 'https'
            ? 'https://zz.bdstatic.com/linksubmit/push.js'
            : 'http://push.zhanzhang.baidu.com/push.js';
        var first = document.getElementsByTagName('script')[0];
        first.parentNode.insertBefore(bp, first);
    })();
    </script>
</body>
