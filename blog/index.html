<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客 | 禾安</title>
    <meta name="description" content="禾安的博客 - 技术博客、商业洞察、个人思考">
    <!-- 暗黑模式防闪烁 -->
    <script>
        (function(){try{var t=localStorage.getItem('theme-mode')||'system';var u=new URLSearchParams(location.search).get('theme');var m=(u&&['light','dark','system'].includes(u))?u:t;var d=m==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):m;document.documentElement.classList.toggle('dark',d==='dark')}catch(e){}})();
    </script>
    <script src="../js/config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = TAILWIND_CONFIG;
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../js/common.css">
</head>
<body class="bg-light text-slate-800 dark:bg-dark dark:text-slate-200 font-sans">

    <!-- 导航栏：纯静态 HTML，JS 只做高亮和事件绑定 -->
    <nav class="fixed w-full z-50 glass-effect border-b border-slate-200 dark:border-slate-800 transition-all duration-300" id="navbar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="../index.html" class="flex-shrink-0 flex items-center">
                    <i class="fa-solid fa-code text-primary text-2xl mr-2"></i>
                    <span class="font-bold text-xl tracking-tight">禾安</span>
                </a>
                <div class="hidden md:flex space-x-8">
                    <a href="../index.html" data-nav="home" class="hover:text-primary transition-colors">首页</a>
                    <a href="../projects/index.html" data-nav="projects" class="hover:text-primary transition-colors">项目</a>
                    <a href="../blog/index.html" data-nav="blog" class="text-primary font-medium">博客</a>
                    <a href="../about/index.html" data-nav="about" class="hover:text-primary transition-colors">关于我</a>
                    <a href="../contact/index.html" data-nav="contact" class="hover:text-primary transition-colors">联系</a>
                </div>
                <div class="flex items-center space-x-3">
                    <button id="theme-toggle" class="p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors" title="切换主题 (亮色/暗色/跟随系统)">
                        <span class="theme-icon-light"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></span>
                        <span class="theme-icon-dark" style="display:none"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
                        <span class="theme-icon-system" style="display:none"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></span>
                    </button>
                    <button id="menu-toggle" class="md:hidden p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                        <i class="fas fa-bars" id="menu-icon-open"></i>
                        <i class="fas fa-times hidden" id="menu-icon-close"></i>
                    </button>
                </div>
            </div>
            <div class="md:hidden hidden" id="mobile-menu">
                <div class="pb-4 space-y-2 border-t border-slate-200 dark:border-slate-700 pt-4">
                    <a href="../index.html" data-nav="home" class="block px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">首页</a>
                    <a href="../projects/index.html" data-nav="projects" class="block px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">项目</a>
                    <a href="../blog/index.html" data-nav="blog" class="block px-3 py-2 rounded-lg text-primary font-medium bg-blue-50 dark:bg-blue-900/20">博客</a>
                    <a href="../about/index.html" data-nav="about" class="block px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">关于我</a>
                    <a href="../contact/index.html" data-nav="contact" class="block px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">联系</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-24 pb-20">
        <div class="fade-in-up flex flex-col md:flex-row gap-8">
            <!-- 左侧分类导航（动态生成，只展示有数据的分组） -->
            <aside class="flex-shrink-0 w-full md:w-44">
                <nav class="md:sticky md:top-24 flex flex-wrap justify-center md:flex-col md:justify-start gap-2" id="blog-sidebar">
                    <button class="blog-side-btn active w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2" data-tag="all"><i class="fas fa-border-all text-xs"></i>全部</button>
                </nav>
            </aside>

            <!-- 右侧文章列表 -->
            <div class="flex-1">
                <div class="space-y-6" id="blog-list"></div>
                <div class="hidden text-center py-16" id="empty-state">
                    <i class="fas fa-folder-open text-4xl text-slate-300 dark:text-slate-600 mb-4"></i>
                    <p class="text-slate-500">暂无该分类的文章</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-12"></footer>

    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/views.js"></script>
    <script src="../js/theme.js"></script>
    <script>
        initApp('blog');
        let blogsData = [];

        function renderBlogs(filter = 'all') {
            const blogList = document.getElementById('blog-list');
            const emptyState = document.getElementById('empty-state');
            const filtered = filter === 'all' ? blogsData : blogsData.filter(b => b.group === filter);
            if (filtered.length === 0) { blogList.innerHTML = ''; emptyState.classList.remove('hidden'); return; }
            emptyState.classList.add('hidden');
            blogList.innerHTML = filtered.map(blog => `
                <a href="detail.html?id=${blog.id}&from=blog" class="block group">
                    <article class="bg-white dark:bg-slate-800 rounded-xl p-6 md:p-8 shadow-md hover:shadow-xl transition-all border border-slate-100 dark:border-slate-700">
                        <div class="flex flex-col md:flex-row md:items-start gap-4">
                            <div class="flex-1">
                                <div class="flex items-center gap-3 mb-3">
                                    ${getGroupBadgeHtml(blog.group)}
                                    <span class="text-sm text-slate-400">${blog.date}</span>
                                </div>
                                <h2 class="text-xl md:text-2xl font-bold mb-3 group-hover:text-primary transition-colors">${blog.title}</h2>
                                <p class="text-slate-600 dark:text-slate-400 text-sm leading-relaxed mb-4">${blog.summary}</p>
                                <span class="inline-flex items-center text-primary text-sm font-medium group-hover:underline">
                                    阅读全文 <i class="fas fa-arrow-right ml-2 text-xs group-hover:translate-x-1 transition-transform"></i>
                                </span>
                            </div>
                            <div class="hidden md:block flex-shrink-0 w-28 h-28 rounded-lg overflow-hidden">
                                <img src="${blog.cover_image}" alt="${blog.title}" class="w-full h-full object-cover">
                            </div>
                        </div>
                    </article>
                </a>`).join('');
        }

        async function fetchBlogs() {
            const data = await loadBlogs();
            if (!data) return;
            blogsData = data.blogs;

            // 侧边栏：按 GROUP_LIST 固定顺序生成分组按钮
            const sidebar = document.getElementById('blog-sidebar');
            // "全部"按钮绑定点击事件
            const allBtn = sidebar.querySelector('[data-tag="all"]');
            if (allBtn) {
                allBtn.addEventListener('click', () => {
                    document.querySelectorAll('.blog-side-btn').forEach(b => b.classList.remove('active'));
                    allBtn.classList.add('active');
                    renderBlogs('all');
                });
            }
            // 按 GROUP_LIST 追加分组按钮
            const groupIcons = { '技术博客': 'fa-code', '商业洞察': 'fa-chart-line', '个人思考': 'fa-lightbulb' };
            GROUP_LIST.forEach(group => {
                const icon = groupIcons[group] || 'fa-tag';
                const btn = document.createElement('button');
                btn.className = 'blog-side-btn w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2';
                btn.dataset.tag = group;
                btn.innerHTML = `<i class="fas ${icon} text-xs"></i>${group}`;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.blog-side-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderBlogs(group);
                });
                sidebar.appendChild(btn);
            });

            renderBlogs();
        }
        (async () => {
            await initTagMapFromAPI();
            fetchBlogs();
        })();
    </script>
</body>
</html>
