<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系合作 | 禾安</title>
    <meta name="description" content="" id="meta-desc">
    <!-- 暗黑模式防闪烁：在页面渲染前设置 dark 类 -->
    <script>
        (function() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <script src="../js/config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = TAILWIND_CONFIG;</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../js/common.css">
</head>
<body class="bg-light text-slate-800 dark:bg-dark dark:text-slate-200 font-sans">

    <!-- 导航栏：纯静态 HTML，JS 只做高亮和事件绑定 -->
    <nav class="fixed w-full z-50 glass-effect border-b border-slate-200 dark:border-slate-800 transition-all duration-300" id="navbar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="../index.html" class="flex-shrink-0 flex items-center">
                    <i class="fa-solid fa-code text-primary text-2xl mr-2"></i>
                    <span class="font-bold text-xl tracking-tight" id="site-name">禾安</span>
                </a>
                <div class="hidden md:flex space-x-8">
                    <a href="../index.html" data-nav="home" class="hover:text-primary transition-colors">首页</a>
                    <a href="../about/index.html" data-nav="about" class="hover:text-primary transition-colors">关于我</a>
                    <a href="../projects/index.html" data-nav="projects" class="hover:text-primary transition-colors">项目作品</a>
                    <a href="../blog/index.html" data-nav="blog" class="hover:text-primary transition-colors">博客</a>
                    <a href="../contact/index.html" data-nav="contact" class="text-primary font-medium">联系合作</a>
                </div>
                <div class="flex items-center space-x-3">
                    <button id="theme-toggle" class="p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                        <i class="fas fa-moon dark:hidden"></i>
                        <i class="fas fa-sun hidden dark:block text-yellow-400"></i>
                    </button>
                    <button id="menu-toggle" class="md:hidden p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                        <i class="fas fa-bars" id="menu-icon-open"></i>
                        <i class="fas fa-times hidden" id="menu-icon-close"></i>
                    </button>
                </div>
            </div>
            <div class="md:hidden hidden" id="mobile-menu">
                <div class="pb-4 space-y-2 border-t border-slate-200 dark:border-slate-700 pt-4">
                    <a href="../index.html" data-nav="home" class="block px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">首页</a>
                    <a href="../about/index.html" data-nav="about" class="block px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">关于我</a>
                    <a href="../projects/index.html" data-nav="projects" class="block px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">项目作品</a>
                    <a href="../blog/index.html" data-nav="blog" class="block px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">博客</a>
                    <a href="../contact/index.html" data-nav="contact" class="block px-3 py-2 rounded-lg text-primary font-medium bg-blue-50 dark:bg-blue-900/20">联系合作</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 pt-24 pb-20">
        <div class="grid md:grid-cols-2 gap-12">
            <!-- 联系方式（动态渲染） -->
            <div class="fade-in-up" id="contact-info"></div>

            <!-- 意向表单 -->
            <div class="fade-in-up">
                <h2 class="text-xl font-bold mb-6">留下您的需求</h2>
                <form class="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-lg border border-slate-100 dark:border-slate-700 space-y-5" onsubmit="event.preventDefault(); document.getElementById('submit-success').classList.remove('hidden');">
                    <div>
                        <label class="block text-sm font-medium mb-1">您的称呼</label>
                        <input type="text" placeholder="怎么称呼您" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent focus:ring-2 focus:ring-primary outline-none transition-colors">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">联系方式 <span class="text-slate-400 font-normal">（邮箱或微信）</span></label>
                        <input type="text" placeholder="your@email.com 或微信号" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent focus:ring-2 focus:ring-primary outline-none transition-colors">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">合作类型</label>
                        <select class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent focus:ring-2 focus:ring-primary outline-none transition-colors">
                            <option value="">请选择</option>
                            <option value="app">App 定制开发</option>
                            <option value="consult">技术咨询</option>
                            <option value="publish">上架协助</option>
                            <option value="mini">小程序开发</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">需求描述</label>
                        <textarea rows="4" placeholder="简单描述您的项目需求、预算范围和期望时间..." class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent focus:ring-2 focus:ring-primary outline-none transition-colors resize-none"></textarea>
                    </div>
                    <button type="submit" class="w-full py-3 rounded-lg bg-primary text-white font-medium hover:bg-blue-600 transition-colors shadow-lg hover:shadow-blue-500/30">
                        <i class="fas fa-paper-plane mr-2"></i>提交意向
                    </button>
                    <div id="submit-success" class="hidden text-center py-3 rounded-lg bg-green-50 dark:bg-green-900/20 text-green-700 dark:text-green-400 text-sm">
                        <i class="fas fa-check-circle mr-1"></i> 意向已收到，我会尽快回复您！
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-12"></footer>

    <script src="../js/api.js"></script>
    <script src="../js/views.js"></script>
    <script src="../js/theme.js"></script>
    <script>
        initApp('contact');

        // ---------- 动态加载联系信息 ----------
        (async function loadContactPage() {
            const cfgData = await loadBaseConfig();
            const profileData = await loadProfile();

            // 站点名 & SEO
            const cfg = cfgData ? (cfgData.config || {}) : {};
            const siteName = cfg.site_name || SITE.name;
            document.querySelectorAll('#site-name').forEach(el => { el.textContent = siteName; });
            document.title = `联系合作 | ${siteName}`;
            const metaDesc = document.getElementById('meta-desc');
            if (metaDesc) metaDesc.content = `联系${siteName} - 项目合作、技术咨询、定制开发`;

            // 联系人数据
            const about = (profileData && profileData.about) ? profileData.about : null;
            const contacts = (about && about.contacts) ? about.contacts : {};

            // 渲染联系方式
            const container = document.getElementById('contact-info');
            const contactItems = [];

            // 邮箱
            if (contacts.email) {
                contactItems.push(`
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-lg bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center flex-shrink-0">
                            <i class="fas fa-envelope text-primary"></i>
                        </div>
                        <div>
                            <p class="text-sm text-slate-500">邮箱</p>
                            <a href="mailto:${contacts.email}" class="font-medium hover:text-primary transition-colors">${contacts.email}</a>
                        </div>
                    </div>
                `);
            }

            // 微信
            if (contacts.weixin) {
                contactItems.push(`
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-lg bg-green-100 dark:bg-green-900/30 flex items-center justify-center flex-shrink-0">
                            <i class="fab fa-weixin text-green-600"></i>
                        </div>
                        <div>
                            <p class="text-sm text-slate-500">微信</p>
                            <p class="font-medium">${contacts.weixin}</p>
                        </div>
                    </div>
                `);
            }

            // GitHub
            if (contacts.github_url) {
                contactItems.push(`
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-lg bg-slate-100 dark:bg-slate-700 flex items-center justify-center flex-shrink-0">
                            <i class="fab fa-github text-slate-700 dark:text-slate-300"></i>
                        </div>
                        <div>
                            <p class="text-sm text-slate-500">GitHub</p>
                            <a href="${contacts.github_url}" target="_blank" class="font-medium hover:text-primary transition-colors">${contacts.github_url}</a>
                        </div>
                    </div>
                `);
            }

            // Twitter
            if (contacts.twitter_url) {
                contactItems.push(`
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-lg bg-purple-100 dark:bg-purple-900/30 flex items-center justify-center flex-shrink-0">
                            <i class="fab fa-twitter text-blue-400"></i>
                        </div>
                        <div>
                            <p class="text-sm text-slate-500">Twitter</p>
                            <a href="${contacts.twitter_url}" target="_blank" class="font-medium hover:text-primary transition-colors">${contacts.twitter_url}</a>
                        </div>
                    </div>
                `);
            }

            // 渲染标题 + 联系方式列表
            if (contactItems.length > 0) {
                let html = '<h2 class="text-xl font-bold mb-6">联系方式</h2><div class="space-y-5">' + contactItems.join('') + '</div>';
                container.innerHTML = html;
            }

            // 公众号二维码
            const qrSection = document.createElement('div');
            if (contacts.public_account) {
                qrSection.className = 'mt-10';
                qrSection.innerHTML = `
                    <h3 class="font-bold mb-4">关注公众号</h3>
                    <div class="w-48 h-48 bg-slate-100 dark:bg-slate-700 rounded-lg overflow-hidden">
                        <img src="${contacts.public_account}" alt="公众号二维码" class="w-full h-full object-cover">
                    </div>
                `;
                container.appendChild(qrSection);
            }

            // Newsletter 订阅入口：根据 subscribe_enabled 控制显隐
            if (contacts.subscribe_enabled) {
                const newsletterSection = document.createElement('div');
                newsletterSection.className = 'mt-10';
                newsletterSection.innerHTML = `
                    <h3 class="font-bold mb-4">订阅 Newsletter</h3>
                    <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">获取最新技术文章和独立开发资讯</p>
                    <form class="space-y-4 text-left" onsubmit="return handleContactNewsletter(event);">
                        <div>
                            <input type="email" id="contact-newsletter-email" placeholder="your@email.com" required
                                class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent focus:ring-2 focus:ring-primary outline-none">
                        </div>
                        <p id="contact-newsletter-msg" class="text-sm text-center hidden"></p>
                        <button type="submit" id="contact-newsletter-btn" class="w-full py-2 bg-primary text-white rounded-lg hover:bg-blue-600 transition-colors">
                            订阅
                        </button>
                    </form>
                `;
                container.appendChild(newsletterSection);
            }

            // 底部文案
            const tagline = document.createElement('p');
            tagline.className = 'mt-8 text-lg text-slate-600 dark:text-slate-400';
            tagline.textContent = `有项目想法或合作需求？随时联系我`;
            container.appendChild(tagline);

            // 如果完全没有联系方式，隐藏整个区域
            if (contactItems.length === 0 && !contacts.public_account) {
                container.style.display = 'none';
            }

            // 页脚链接：用 about.contacts 中的链接更新
            renderFooter(contacts);
        })();

        // ---------- Contact 页 Newsletter 订阅 ----------
        async function handleContactNewsletter(event) {
            event.preventDefault();
            const emailInput = document.getElementById('contact-newsletter-email');
            const msgEl = document.getElementById('contact-newsletter-msg');
            const btn = document.getElementById('contact-newsletter-btn');
            const email = emailInput.value.trim();
            if (!email) return;

            btn.disabled = true;
            btn.textContent = '提交中...';
            msgEl.classList.add('hidden');

            const result = await subscribeNewsletter(email);

            msgEl.textContent = result.message;
            msgEl.classList.remove('hidden');
            msgEl.className = `text-sm text-center ${result.success ? 'text-green-600' : 'text-red-500'}`;

            if (result.success) emailInput.value = '';
            btn.disabled = false;
            btn.textContent = '订阅';
        }
    </script>
</body>
</html>
