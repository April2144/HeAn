<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>禾安 | 独立开发者 & 技术博主</title>
    <meta name="description" content="" id="meta-desc">
    <!-- 暗黑模式防闪烁 -->
    <script>
        (function(){try{var t=localStorage.getItem('theme-mode')||'system';var u=new URLSearchParams(location.search).get('theme');var m=(u&&['light','dark','system'].includes(u))?u:t;var d=m==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):m;document.documentElement.classList.toggle('dark',d==='dark')}catch(e){}})();
    </script>
    <script src="./js/config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = TAILWIND_CONFIG;
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./js/common.css">
</head>
<body class="bg-light text-slate-800 dark:bg-dark dark:text-slate-200 font-sans">

    <!-- 导航栏：纯静态 HTML，JS 只做高亮和事件绑定 -->

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="./index.html" class="flex-shrink-0 flex items-center">
                    <i class="fa-solid fa-code text-primary text-2xl mr-2"></i>
                    <span class="font-bold text-xl tracking-tight" id="site-name">禾安</span>
                </a>
                <div class="hidden md:flex space-x-8">
                    <a href="./index.html" data-nav="home" class="text-primary font-medium">首页</a>
                    <a href="./projects/index.html" data-nav="projects" class="hover:text-primary transition-colors">项目</a>
                    <a href="./blog/index.html" data-nav="blog" class="hover:text-primary transition-colors">博客</a>
                    <a href="./about/index.html" data-nav="about" class="hover:text-primary transition-colors">关于我</a>
                    <a href="./contact/index.html" data-nav="contact" class="hover:text-primary transition-colors">联系</a>
                </div>
                <div class="flex items-center space-x-3">
                    <button id="theme-toggle" class="p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors" title="切换主题 (亮色/暗色/跟随系统)">
                        <span class="theme-icon-light"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></span>
                        <span class="theme-icon-dark" style="display:none"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
                        <span class="theme-icon-system" style="display:none"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></span>
                    </button>
                    <button id="menu-toggle" class="md:hidden p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                        <i class="fas fa-bars" id="menu-icon-open"></i>
                        <i class="fas fa-times hidden" id="menu-icon-close"></i>
                    </button>
                </div>
            </div>
            <div class="md:hidden hidden" id="mobile-menu">
                <div class="pb-4 space-y-2 border-t border-slate-200 dark:border-slate-700 pt-4">
                    <a href="./index.html" data-nav="home" class="block px-3 py-2 rounded-lg text-primary font-medium bg-blue-50 dark:bg-blue-900/20">首页</a>
                    <a href="./projects/index.html" data-nav="projects" class="block px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">项目</a>
                    <a href="./blog/index.html" data-nav="blog" class="block px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">博客</a>
                    <a href="./about/index.html" data-nav="about" class="block px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">关于我</a>
                    <a href="./contact/index.html" data-nav="contact" class="block px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">联系</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero 区域 -->
    <section class="pt-32 pb-20 lg:pt-48 lg:pb-32 px-4">
        <div class="max-w-7xl mx-auto text-center fade-in-up">
            <div class="inline-block p-2 px-4 rounded-full bg-blue-100 text-primary text-sm font-semibold mb-6 dark:bg-blue-900/30">
                👋 你好，我是独立开发者
            </div>
            <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-6">
                构建 <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary">数字产品</span><br>
                分享 <span class="text-transparent bg-clip-text bg-gradient-to-r from-secondary to-primary">技术洞察</span>
            </h1>
            <p class="mt-4 max-w-2xl mx-auto text-xl text-slate-600 dark:text-slate-400" id="hero-bio" style="display:none"></p>
            <div class="mt-10 flex justify-center gap-4">
                <a href="#projects" class="px-8 py-3 rounded-lg bg-primary text-white font-medium hover:bg-blue-600 transition-all shadow-lg hover:shadow-blue-500/30">
                    查看作品
                </a>
                <a href="#contact" class="px-8 py-3 rounded-lg border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
                    联系我
                </a>
            </div>
        </div>
    </section>

    <!-- 关于我（动态渲染） -->
    <section class="py-12 bg-white dark:bg-slate-900/50" id="home-about-section">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="lg:grid lg:grid-cols-2 lg:gap-12 lg:items-stretch">
                <div class="relative">
                    <div class="absolute -inset-4 bg-gradient-to-r from-primary to-secondary rounded-2xl opacity-30 blur-lg"></div>
                    <img src="https://picsum.photos/600/400?tech" alt="开发者工作场景" class="relative rounded-2xl shadow-2xl w-full object-cover" id="home-about-avatar">
                </div>
                <div class="mt-8 lg:mt-0 flex flex-col justify-between">
                    <div>
                        <h2 class="text-3xl font-bold mb-6">关于我</h2>
                        <div id="home-about-intro" class="text-base text-slate-600 dark:text-slate-400 mb-6 leading-relaxed"></div>
                        <div class="space-y-5">
                            <div id="home-about-tech">
                                <h3 class="font-semibold text-lg mb-3">技术栈</h3>
                                <div class="flex flex-wrap gap-2" id="home-tech-stacks"></div>
                            </div>
                            <div id="home-about-services">
                                <h3 class="font-semibold text-lg mt-6 mb-3">服务内容</h3>
                                <div class="flex flex-wrap gap-2" id="home-services"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 项目作品 -->
    <section id="projects" class="py-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-end mb-12">
                <div>
                    <h2 class="text-3xl font-bold mb-4">精选项目</h2>
                    <p class="text-slate-600 dark:text-slate-400">近期独立开发或参与的核心产品</p>
                </div>
                <a href="projects/index.html" class="text-primary hover:underline hidden md:block">查看全部 -></a>
            </div>

            <div class="flex gap-6 overflow-x-auto pb-4 snap-x snap-mandatory scrollbar-hide" id="projects-grid" style="-webkit-overflow-scrolling: touch; scrollbar-width: none;">
                <!-- 项目卡片由 JS 动态生成，限宽 + snap -->
            </div>

            <div class="mt-8 text-center md:hidden">
                <a href="projects/index.html" class="text-primary hover:underline">查看全部 -></a>
            </div>
        </div>
    </section>

    <!-- 博客预览 -->
    <section class="py-20 bg-white dark:bg-slate-900/50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-end mb-12">
                <div>
                    <h2 class="text-3xl font-bold mb-4">最新博文</h2>
                    <p class="text-slate-600 dark:text-slate-400">同步自掘金与个人思考</p>
                </div>
                <a href="blog/index.html" class="text-primary hover:underline hidden md:block">查看全部 -></a>
            </div>

            <div class="grid md:grid-cols-2 gap-8" id="blog-grid">
                <!-- 博客卡片将通过 JS 动态生成 -->
            </div>

            <div class="mt-8 text-center md:hidden">
                <a href="blog/index.html" class="text-primary hover:underline">查看全部 -></a>
            </div>
        </div>
    </section>

    <!-- 公众号引流与联系 -->
    <section id="contact" class="py-20 relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-br from-blue-50 to-indigo-50 dark:from-slate-900 dark:to-slate-800 -z-10"></div>
        <div class="max-w-4xl mx-auto px-4 text-center">
            <h2 class="text-3xl font-bold mb-6">联系我</h2>
            <p class="text-lg text-slate-600 dark:text-slate-400 mb-10">
                订阅我的公众号，获取独家技术资料、源码下载权限及最新独立开发资讯。
            </p>

            <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-xl inline-block w-full max-w-md">
                <div class="w-48 h-48 bg-slate-100 dark:bg-slate-700 mx-auto rounded-lg flex items-center justify-center mb-6">
                    <img src="https://picsum.photos/200/200?qr" alt="公众号二维码" class="w-full h-full object-cover rounded-lg">
                </div>
                <h3 class="font-bold text-xl mb-2">扫码关注「DevTech」</h3>
                <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">回复"简历"获取我的完整技术履历</p>

                <form id="newsletter-form" class="space-y-4 text-left" onsubmit="return handleNewsletterSubmit(event);" style="display:none;">
                    <div>
                        <label class="block text-sm font-medium mb-1">邮箱地址</label>
                        <input id="newsletter-email" type="email" placeholder="your@email.com" required
                            class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent focus:ring-2 focus:ring-primary outline-none">
                    </div>
                    <p id="newsletter-msg" class="text-sm text-center hidden"></p>
                    <button id="newsletter-btn" type="submit" class="w-full py-2 bg-primary text-white rounded-lg hover:bg-blue-600 transition-colors">
                        订阅 Newsletter
                    </button>
                </form>
            </div>
        </div>
    </section>

    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-12"></footer>

    <!-- JS 逻辑 -->
    <script src="./js/api.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/views.js"></script>
    <script src="./js/theme.js"></script>
    <script>
        initApp('home');

        // ---------- Newsletter 订阅 ----------
        async function handleNewsletterSubmit(event) {
            event.preventDefault();
            const emailInput = document.getElementById('newsletter-email');
            const msgEl = document.getElementById('newsletter-msg');
            const btn = document.getElementById('newsletter-btn');
            const email = emailInput.value.trim();

            if (!email) return;

            btn.disabled = true;
            btn.textContent = '提交中...';
            msgEl.classList.add('hidden');

            const result = await subscribeNewsletter(email);

            msgEl.textContent = result.message;
            msgEl.classList.remove('hidden');
            msgEl.className = `text-sm text-center ${result.success ? 'text-green-600' : 'text-red-500'}`;

            if (result.success) {
                emailInput.value = '';
            }

            btn.disabled = false;
            btn.textContent = '订阅 Newsletter';
        }

        // ---------- 站点配置 & Profile ----------
        async function applySiteConfig() {
            const [cfgData, profileData] = await Promise.all([
                loadBaseConfig(),
                loadProfile()
            ]);

            const cfg = (cfgData && cfgData.config) ? cfgData.config : {};
            const services = (cfgData && cfgData.services) ? cfgData.services : [];
            const about = (profileData && profileData.about) ? profileData.about : {};

            // 网站名称
            if (cfg.site_name) {
                document.title = cfg.seo_title || `${cfg.site_name} | 独立开发者 & 技术博主`;
                document.getElementById('meta-desc').content = cfg.seo_description || '';
                document.querySelectorAll('#site-name').forEach(el => el.textContent = cfg.site_name);
            }

            // Hero 描述
            const heroBio = document.getElementById('hero-bio');
            if (cfg.bio) {
                heroBio.textContent = cfg.bio;
                heroBio.style.display = '';
            }

            // 首页关于我模块（用 profile 数据）
            const aboutSection = document.getElementById('home-about-section');
            if (about.intro) {
                document.getElementById('home-about-intro').innerHTML = about.intro.replace(/\n/g, '<br>');
            } else {
                aboutSection.style.display = 'none';
                return;
            }
            if (about.avatar_url) {
                document.getElementById('home-about-avatar').src = about.avatar_url;
            }

            // 技术栈（从 profile 读取，样式已由后端合并模板库）
            const techEl = document.getElementById('home-about-tech');
            const stacksEl = document.getElementById('home-tech-stacks');
            const techStacks = about.tech_stacks || [];
            if (techStacks.length > 0) {
                stacksEl.innerHTML = techStacks.map(t => {
                    const bg = t.bg_color || 'bg-blue-50';
                    const txt = t.text_color || 'text-blue-700';
                    const darkBg = t.dark_bg_color || 'dark:bg-blue-900/30';
                    const darkTxt = t.dark_text_color || 'dark:text-blue-400';
                    const icon = t.icon || 'fa-solid fa-code';
                    return `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-md text-sm font-medium ${bg} ${txt} ${darkBg} ${darkTxt}"><i class="${icon}"></i>${t.name || ''}</span>`;
                }).join('');
                techEl.style.display = '';
            } else {
                techEl.style.display = 'none';
            }

            // 服务内容（过滤隐藏内容）
            const servicesEl = document.getElementById('home-about-services');
            const svcEl = document.getElementById('home-services');
            const visibleServices = services.filter(s => !s.hidden);
            if (visibleServices.length > 0) {
                svcEl.innerHTML = visibleServices.map(s =>
                    `<span class="px-3 py-1 bg-emerald-50 dark:bg-emerald-900/20 text-emerald-700 dark:text-emerald-400 rounded-md text-sm"><i class="${s.icon} mr-1"></i>${s.title}</span>`
                ).join('');
                servicesEl.style.display = '';
            } else {
                servicesEl.style.display = 'none';
            }

            // 订阅入口：根据 subscribe_enabled 控制显隐
            const contacts = about.contacts || {};
            const newsletterForm = document.getElementById('newsletter-form');
            if (newsletterForm) {
                newsletterForm.style.display = contacts.subscribe_enabled ? '' : 'none';
            }

            // 页脚链接：用 about.contacts 中的链接更新
            renderFooter(contacts);
        }

        // ---------- 项目 & 博客数据 ----------
        async function loadHomeData() {
            const [projectData, blogData] = await Promise.all([
                loadProjects(),
                loadBlogs()
            ]);

            if (projectData) {
                const projectsGrid = document.getElementById('projects-grid');
                const allProjects = [...(projectData.personal || []), ...(projectData.collab || [])];
                allProjects.forEach(project => {
                    const card = document.createElement('a');
                    card.href = `projects/detail.html?id=${project.id}&from=home`;
                    card.className = "block group flex-shrink-0 w-80 snap-start";
                    card.innerHTML = `
                        <article class="bg-white dark:bg-slate-800 rounded-xl overflow-hidden shadow-lg hover:shadow-2xl transition-all duration-300 border border-slate-100 dark:border-slate-700 h-full">
                            <div class="overflow-hidden">
                                <img src="${project.cover_image}" alt="${project.title}" class="w-full h-44 object-cover transform group-hover:scale-105 transition-transform duration-500">
                            </div>
                            <div class="p-5">
                                <div class="flex flex-wrap gap-2 mb-3">
                                    ${(project.tags || []).map(tag => `<span class="text-xs font-semibold px-2 py-1 bg-blue-100 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 rounded">${tag}</span>`).join('')}
                                </div>
                                <h3 class="text-lg font-bold mb-2 group-hover:text-primary transition-colors line-clamp-1">${project.title}</h3>
                                <p class="text-slate-600 dark:text-slate-400 text-sm mb-3 line-clamp-2">${project.description}</p>
                                <span class="inline-flex items-center text-primary text-sm font-medium group-hover:underline">
                                    查看详情 <i class="fas fa-arrow-right ml-2 text-xs"></i>
                                </span>
                            </div>
                        </article>
                    `;
                    projectsGrid.appendChild(card);
                });
            }

            if (blogData) {
                const blogGrid = document.getElementById('blog-grid');
                blogData.blogs.slice(0, 2).forEach(blog => {
                    const card = document.createElement('a');
                    card.href = `blog/detail.html?id=${blog.id}&from=home`;
                    card.className = "flex flex-col md:flex-row gap-6 bg-white dark:bg-slate-800 p-6 rounded-xl shadow-md hover:shadow-lg transition-all border border-slate-100 dark:border-slate-700 group";
                    card.innerHTML = `
                        <div class="flex-1">
                            <div class="flex items-center gap-3 mb-3">
                                ${getGroupBadgeHtml(blog.group)}
                                <span class="text-sm text-slate-400">${blog.date}</span>
                            </div>
                            <h3 class="text-xl font-bold mb-3 group-hover:text-primary transition-colors">${blog.title}</h3>
                            <p class="text-slate-600 dark:text-slate-400 text-sm line-clamp-2 mb-4">${blog.summary}</p>
                            <span class="text-primary text-sm font-medium hover:underline inline-flex items-center">阅读全文 <i class="fas fa-arrow-right ml-2 text-xs"></i></span>
                        </div>
                    `;
                    blogGrid.appendChild(card);
                });
            }
        }
        (async () => {
            await initTagMapFromAPI();
            applySiteConfig();
            loadHomeData();
        })();
    </script>
</body>
</html>
