    <!-- SEO：规范链接 + 分享卡片（静态写死 → 爬虫不执行 JS 也能读到 ✓；JS 之后会用后台配置再覆盖一次） -->

    <meta name="twitter:description" content="专注iOS移动端开发10年，分享技术、产品与独立开发思考">
    <meta name="twitter:image" content="https://hacore.cn/assets/img/og-cover.png">
    <!-- 结构化数据：静态写一份（爬虫不执行 JS 也能读到 ✓）
         ⚠️ id 必须与 seo.js 的 applyJsonLd() 一致：JS 会【改写同一个节点】而不是新增，
            因此不会出现两条重复的 JSON-LD ✓（同 id 覆盖，站点名等仍以后台配置为准 ✓） -->
    <script type="application/ld+json" id="seo-jsonld">
    [
        {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "禾安的笔记",
            "alternateName": "hacore.cn",
            "url": "https://hacore.cn/",
            "description": "专注iOS移动端开发10年，分享技术、产品与独立开发思考"
        },
        {
            "@context": "https://schema.org",
            "@type": "Person",
            "name": "禾安的笔记",
            "url": "https://hacore.cn/about/",
            "jobTitle": "独立开发者",
            "description": "独立开发路上的探索者，在AI时代持续迭代技术边界"
        }
    ]
    </script>
    <!-- 暗黑模式防闪烁 -->
    <script>
        (function(){try{var t=localStorage.getItem('theme-mode')||'system';var u=new URLSearchParams(location.search).get('theme');var m=(u&&['light','dark','system'].includes(u))?u:t;var d=m==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):m;document.documentElement.classList.toggle('dark',d==='dark')}catch(e){}})();
    </script>
    <script src="./js/config.js"></script>
        <!-- ⚠️ Tailwind / Font Awesome 已本地化（assets/vendor/）：不再依赖外网 CDN（DNS 污染 / 断网时页面才不会丢样式）
         来源：cdn.tailwindcss.com（浏览器运行版）、cdnjs.cloudflare.com/…/font-awesome/6.4.0 —— 升级时需重新下载替换 ✓ -->
    <script src="assets/vendor/tailwind.js"></script>
    <script>
        tailwind.config = TAILWIND_CONFIG;
    </script>
    <link rel="stylesheet" href="assets/vendor/font-awesome/all.min.css">
    <link rel="stylesheet" href="./js/common.css?v=20260921d">

</head>
<body class="bg-light text-slate-800 dark:bg-dark dark:text-slate-200 font-sans">

    <!-- 导航栏：由 renderNavbar 统一生成 -->
    <nav id="navbar"></nav>

    <!-- Hero 区域 -->
    <section class="pt-32 pb-20 lg:pt-48 lg:pb-32 px-4">
        <div class="max-w-7xl mx-auto text-center fade-in-up">
            <div class="inline-block p-2 px-4 rounded-full bg-blue-100 text-primary text-sm font-semibold mb-6 dark:bg-blue-900/30">
                👋 AI 时代的独立开发者
            </div>
            <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-6">
                构建 <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary">数字产品</span><br>
                分享 <span class="text-transparent bg-clip-text bg-gradient-to-r from-secondary to-primary">技术洞察</span>
            </h1>
            <p class="mt-4 max-w-2xl mx-auto text-xl text-slate-600 dark:text-slate-400" id="hero-bio" style="display:none"></p>
            <div class="mt-10 flex justify-center gap-4">
                <a href="#projects" class="btn-primary px-8 py-3 rounded-lg">
                    看看产品
                </a>
                <a href="./about/#about-cta-section" class="btn-ghost px-8 py-3 rounded-lg">
                    联系我
                </a>
            </div>
        </div>
    </section>

    <!-- 精选专题（横向滚动） -->
    <section id="topics" class="pt-16 pb-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-end mb-12">
                <div>
                    <h2 class="text-3xl font-bold mb-4">精选专题</h2>
                    <p class="text-slate-600 dark:text-slate-400">系统化学习路线，构建完整知识体系</p>
                </div>
                <a href="topics/" class="text-primary hover:underline hidden md:block">更多 <i class="fas fa-angle-double-right ml-1"></i></a>
            </div>

            <div class="flex gap-6 overflow-x-auto pb-4 pt-4 -mt-4 snap-x snap-mandatory scrollbar-hide" id="topics-grid" style="-webkit-overflow-scrolling: touch; scrollbar-width: none;">
                <!-- 精选专题卡片由 JS 动态生成 -->
            </div>

            <div class="mt-8 text-center md:hidden">
                <a href="topics/" class="text-primary hover:underline">更多 <i class="fas fa-angle-double-right ml-1"></i></a>
            </div>
        </div>
    </section>

    <!-- 产品（只放用户能用 / 能下载的东西；没有则不显示该模块） -->
    <section id="projects" class="py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-end mb-12">
                <div>
                    <h2 class="text-3xl font-bold mb-4">精选产品</h2>
                    <p class="text-slate-600 dark:text-slate-400">我做的、你能用的东西</p>
                </div>
                <a href="projects/" class="text-primary hover:underline hidden md:block">更多 <i class="fas fa-angle-double-right ml-1"></i></a>
            </div>

            <div class="flex gap-6 overflow-x-auto pb-4 snap-x snap-mandatory scrollbar-hide" id="projects-grid" style="-webkit-overflow-scrolling: touch; scrollbar-width: none;">
                <!-- 项目卡片由 JS 动态生成，限宽 + snap -->
            </div>

            <div class="mt-8 text-center md:hidden">
                <a href="projects/" class="text-primary hover:underline">更多 <i class="fas fa-angle-double-right ml-1"></i></a>
            </div>
        </div>
    </section>

    <!-- 最新博客（只含博客）—— 放在精选专题 / 精选项目之后 -->
    <section id="updates" class="pt-12 pb-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="mb-12">
                <h2 class="text-3xl font-bold mb-4">最新博客</h2>
                <p class="text-slate-600 dark:text-slate-400">最近发布的博客文章</p>
            </div>

            <div class="grid md:grid-cols-2 gap-4" id="updates-grid">
                <!-- 由 JS 动态生成 -->
            </div>
        </div>
    </section>

    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-12">
        <!-- ⚠️ 无 JS 时的静态回退（站点名 + 备案号）：百度等爬虫不执行 JS，这些信息必须静态可读 ✓
             JS 加载后由 views.js 的 renderFooter() 整体替换 footer → 真实用户看到的仍是原页脚 ✓ 不重复 ✓
             内容由 my_server/scripts/gen_static.py 从后台「网站配置」自动同步，请勿手改 ✗ -->
        <div id="filing-static" class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 leading-relaxed">
            <p>禾安的笔记</p>
            <p><a href="https://beian.miit.gov.cn" rel="noopener">豫ICP备2026043016号-1</a> · <a href="https://beian.mps.gov.cn/#/query/webSearch?code=41018302000609" rel="noopener">豫公网安备41018302000609号</a></p>
        </div>
    </footer>

    <!-- JS 逻辑 -->
    <script src="./vendor/localforage.min.js"></script>
    <script src="./js/api.js?v=20260930a"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/views.js?v=20260930a"></script>
    <script src="./js/seo.js?v=20260930a"></script>
    <script src="./js/topics.js?v=2"></script>
    <script src="./js/theme.js?v=20260930a"></script>
    <script src="./js/auth.js?v=20260921e"></script>
    <!-- Tiptap JSON 文档模型渲染层（正文标准渲染路径） -->
    <script src="./js/renderer.js"></script>
    <script>
        initApp('home', { type: 'main' });

        // ---------- Newsletter 订阅 ----------
        async function handleNewsletterSubmit(event) {
            event.preventDefault();
            const emailInput = document.getElementById('newsletter-email');
            const msgEl = document.getElementById('newsletter-msg');
            const btn = document.getElementById('newsletter-btn');
            const email = emailInput.value.trim();

            if (!email) return;

            btn.disabled = true;
            btn.textContent = '提交中...';
            msgEl.classList.add('hidden');

            const result = await subscribeNewsletter(email);

            msgEl.textContent = result.message;
            msgEl.classList.remove('hidden');
            msgEl.className = `text-sm text-center ${result.success ? 'text-green-600' : 'text-red-500'}`;

            if (result.success) {
                emailInput.value = '';
            }

            btn.disabled = false;
            btn.textContent = '订阅 Newsletter';
        }

        // ---------- 站点配置 & Profile ----------
        async function applySiteConfig() {
            const [cfgData, profileData] = await Promise.all([
                loadBaseConfig(),
                loadProfile()
            ]);

            const cfg = (cfgData && cfgData.config) ? cfgData.config : {};
            const services = (cfgData && cfgData.services) ? cfgData.services : [];
            const about = (profileData && profileData.about) ? profileData.about : {};

            // 网站名称：品牌名改由 views.js 的 applySiteName() 单点统一（原先这里各写一份，导致各页面显示不一致）
            if (cfg.site_name) {
                const seoTitle = cfg.seo_title || `${cfg.site_name} | 独立开发者 & 技术博主`;
                const seoDesc = cfg.seo_description || '独立开发者，专注 iOS 移动端开发，分享技术、产品与独立开发思考。';
                document.title = seoTitle;
                document.getElementById('meta-desc').content = seoDesc;
                // 分享卡片 / 规范链接 / 结构化数据统一走 seo.js 单点 ✓
                if (window.HeAnSeo) {
                    HeAnSeo.apply({
                        title: seoTitle,
                        description: seoDesc,
                        jsonLd: [
                            HeAnSeo.jsonLd.website(seoDesc),
                            HeAnSeo.jsonLd.person({ bio: cfg.bio, tech_stacks: about.tech_stacks || [] }),
                        ],
                    });
                }
            }

            // Hero 描述
            const heroBio = document.getElementById('hero-bio');
            if (cfg.bio) {
                heroBio.textContent = cfg.bio;
                heroBio.style.display = '';
            }

            // 首页关于我模块已移除（HTML 区块已删除）：仅保留页脚联系链接（基于 profile.contacts）渲染
            const contacts = about.contacts || {};
            renderFooter(contacts);
        }

        // ---------- 项目 & 博客数据 ----------
        async function loadHomeData() {
            const [projectData, updateData] = await Promise.all([
                loadProjects(),
                loadUpdates(8)
            ]);

            if (projectData) {
                const projectsGrid = document.getElementById('projects-grid');
                // 只展示后台开启"首页推荐"的项目，并按推荐序号(featured_order)升序排列
                const allProjects = (projectData.projects || [])
                    .filter(p => (p.is_featured ?? 0) === 1)
                    .sort((a, b) => (a.featured_order ?? 0) - (b.featured_order ?? 0));
                if (!allProjects.length) {
                    // 没有任何首页推荐产品时不显示该模块（不影响其它模块渲染）
                    const projectsSection = document.getElementById('projects');
                    if (projectsSection) projectsSection.style.display = 'none';
                }
                // Hero 的「看看产品」按钮：有产品时滚到产品区，没有时直接去产品页
                // （否则产品区被隐藏后，按钮点了会没反应）
                const heroProductBtn = document.querySelector('a[href="#projects"]');
                if (heroProductBtn) {
                    heroProductBtn.href = allProjects.length ? '#projects' : 'projects/';
                }
                // 半空状态：仅 1 个推荐项目时去掉横向滚动/吸附，改为左对齐单卡片（避免孤卡 + 大片空白）
                if (allProjects.length === 1) {
                    projectsGrid.classList.remove('overflow-x-auto', 'snap-x', 'snap-mandatory', 'scrollbar-hide');
                    projectsGrid.style.overflowX = 'visible';
                }
                allProjects.forEach(project => {
                    // 按平台类型决定跳转：app→商店链接，web→网站链接，都没有则进详情页（老项目兜底）
                    const link = resolveProjectLink(project, `projects/${project.id}/?from=home`);
                    const card = document.createElement('a');
                    card.href = link.href;
                    if (link.external) { card.target = '_blank'; card.rel = 'noopener'; }
                    card.className = "block group flex-shrink-0 w-80 snap-start";
                    card.onclick = () => trackClick('click_project', 'open_project', 'project_card', 'home', 'project', project.id);
                    card.innerHTML = `
                        <article class="card-hover bg-white dark:bg-slate-800 rounded-xl overflow-hidden border border-slate-100 dark:border-slate-700 h-full">
                            <div class="overflow-hidden aspect-[16/9]" style="aspect-ratio:16/9">
                                <img src="${project.cover_image}" alt="${project.title}" class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-500" style="object-fit:cover;object-position:center">
                            </div>
                            <div class="p-5">
                                <div class="flex flex-wrap gap-2 mb-3">
                                    ${getTagListHtml(project.tags)}
                                </div>
                                <h3 class="text-lg font-bold mb-2 group-hover:text-primary transition-theme-color line-clamp-1">${project.title}</h3>
                                <p class="text-slate-600 dark:text-slate-400 text-sm line-clamp-2">${tiptapJsonToPlainText(parseTiptapJson(project.description)).slice(0, 60) || '暂无描述'}</p>
                            </div>
                        </article>
                    `;
                    projectsGrid.appendChild(card);
                });
            }

            if (updateData) {
                // 最新博客：只含博客（后端已按时间倒序、只含已发布）
                const grid = document.getElementById('updates-grid');
                const items = (updateData.items || []).slice(0, 8);
                if (!items.length) {
                    const sec = document.getElementById('updates');
                    if (sec) sec.style.display = 'none';
                }
                items.forEach(it => {
                    // 只含博客（专题文章不进首页，避免与「精选专题」重复）
                    const card = document.createElement('a');
                    card.href = `blog/${it.id}/?from=home`;
                    card.className = "card-hover flex flex-col gap-2 bg-white dark:bg-slate-800 p-5 rounded-xl border border-slate-100 dark:border-slate-700 group";
                    card.onclick = () => trackClick('click_blog', 'open_blog', 'blog_card', 'home', 'blog', it.id);
                    card.innerHTML = `
                        <div class="flex items-center gap-3">
                            ${getCardTagHtml(it.group, it.tags)}
                            <span class="text-sm text-slate-400">${it.date || ''}</span>
                        </div>
                        <h3 class="text-base font-bold group-hover:text-primary transition-theme-color line-clamp-1">${it.title || ''}</h3>
                        <p class="text-slate-600 dark:text-slate-400 text-sm line-clamp-1">${it.summary || ''}</p>
                    `;
                    grid.appendChild(card);
                });
            }
        }
        (async () => {
            try {
                await initTagMapFromAPI();
                await applySiteConfig();
                await loadHomeData();
                await loadHomeTopics();
            } catch (e) {
                console.error('[home] 初始化失败:', e);
            }
        })();
    </script>
    <!-- 百度「自动推送」：页面被访问时自动把 URL 推送给百度，加速收录 -->
    <script>
    (function () {
        var bp = document.createElement('script');
        var protocol = window.location.protocol.split(':')[0];
        // https 与 http 使用不同的推送地址（官方要求）
        bp.src = protocol === 'https'
            ? 'https://zz.bdstatic.com/linksubmit/push.js'
            : 'http://push.zhanzhang.baidu.com/push.js';
        var first = document.getElementsByTagName('script')[0];
        first.parentNode.insertBefore(bp, first);
    })();
    </script>
</body>
</html>
