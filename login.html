<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 | 禾安的笔记</title>
    <!-- 暗黑模式防闪烁 -->
    <script>
        (function(){try{var t=localStorage.getItem('theme-mode')||'system';var u=new URLSearchParams(location.search).get('theme');var m=(u&&['light','dark','system'].includes(u))?u:t;var d=m==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):m;document.documentElement.classList.toggle('dark',d==='dark')}catch(e){}})();
    </script>
    <script src="./js/config.js"></script>
        <!-- ⚠️ Tailwind / Font Awesome 已本地化（assets/vendor/）：不再依赖外网 CDN（DNS 污染 / 断网时页面才不会丢样式）
         来源：cdn.tailwindcss.com（浏览器运行版）、cdnjs.cloudflare.com/…/font-awesome/6.4.0 —— 升级时需重新下载替换 ✓ -->
    <script src="assets/vendor/tailwind.js"></script>
    <script>
        tailwind.config = TAILWIND_CONFIG;
    </script>
    <link rel="stylesheet" href="assets/vendor/font-awesome/all.min.css">
    <link rel="stylesheet" href="./js/common.css?v=20260921d">
    <link rel="icon" href="assets/logo-mark.svg">
</head>
<body class="bg-light text-slate-800 dark:bg-dark dark:text-slate-200 font-sans min-h-screen">

    <!-- 复用主界面导航（logo + 右上角模式切换，不显示页面 tabs） -->
    <nav id="navbar"></nav>

    <div class="pt-24 pb-16 w-full max-w-md mx-auto px-4">
        <div class="text-center mb-8">
            <h1 class="text-xl font-semibold">登录到你的账户</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">未注册用户首次登录将自动创建账号</p>
        </div>

        <!-- 表单内登录方式切换（小文字按钮 + 底部指示 line） -->
        <div class="flex justify-center gap-8 mb-6 text-sm font-medium">
            <button id="tab-code" type="button" class="tab-switch text-primary flex flex-col items-center gap-1">
                <span>验证码登录</span>
                <span class="tab-line h-0.5 w-5 rounded bg-primary"></span>
            </button>
            <button id="tab-password" type="button" class="tab-switch text-slate-500 dark:text-slate-400 hover:text-primary transition-colors flex flex-col items-center gap-1">
                <span>密码登录</span>
                <span class="tab-line h-0.5 w-5 rounded bg-primary hidden"></span>
            </button>
        </div>

        <!-- 验证码登录表单 -->
        <form id="form-code" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">邮箱</label>
                <input id="code-email" type="email" autocomplete="email" required placeholder="请输入邮箱"
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">验证码</label>
                <div class="flex space-x-2">
                    <input id="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" required placeholder="请输入验证码"
                        class="flex-1 px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary outline-none transition">
                    <button id="send-code-btn" type="button"
                        class="px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors whitespace-nowrap">
                        发送验证码
                    </button>
                </div>
            </div>
            <div id="err-code" class="text-sm text-red-500 hidden"></div>
            <button type="submit" id="submit-code"
                class="w-full py-2.5 rounded-lg bg-primary text-white font-medium hover:opacity-90 transition disabled:opacity-50">
                登录
            </button>
        </form>

        <!-- 密码登录表单（默认隐藏） -->
        <form id="form-password" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-medium mb-1">邮箱</label>
                <input id="pwd-email" type="email" autocomplete="email" required placeholder="请输入邮箱"
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">密码</label>
                <input id="pwd-input" type="password" autocomplete="current-password" required placeholder="请输入密码"
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary outline-none transition">
            </div>
            <div id="err-pwd" class="text-sm text-red-500 hidden"></div>
            <button type="submit" id="submit-pwd"
                class="w-full py-2.5 rounded-lg bg-primary text-white font-medium hover:opacity-90 transition disabled:opacity-50">
                登录
            </button>
        </form>

        <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6">
            <a href="./index.html" class="hover:text-primary transition-colors">← 返回首页</a>
        </p>
    </div>

    <script src="./vendor/localforage.min.js"></script>
    <script src="./js/api.js?v=20260930a"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/views.js?v=20260930a"></script>
    <script src="./js/theme.js?v=20260930a"></script>
    <script src="./js/auth.js?v=20260921e"></script>
    <script src="./js/login.js"></script>
    <script>
        initApp('login', { type: 'login' });
    </script>
</body>
</html>
