<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片压缩工具</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e4e7ec;
    --text: #1f2430;
    --muted: #8a919d;
    --primary: #3b82f6;
    --primary-hover: #2f6fe0;
    --danger: #e5484d;
    --ok: #16a34a;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  header h1 { font-size: 20px; margin: 0; }
  .badge {
    font-size: 12px; color: var(--muted); background: var(--card);
    border: 1px solid var(--border); padding: 2px 8px; border-radius: 4px; white-space: nowrap;
  }
  .sub { color: var(--muted); font-size: 13px; margin: 4px 0 20px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin: 0 0 14px; }
  .hidden { display: none !important; }

  /* 添加图片 */
  .drop {
    border: 2px dashed var(--border); border-radius: var(--radius);
    padding: 28px 16px; text-align: center; color: var(--muted); cursor: pointer;
    transition: border-color .15s, background .15s, transform .05s;
  }
  .drop:hover { border-color: #c7d0ed; background: #f7f9ff; }
  .drop:active { border-color: var(--primary); background: #eef4ff; transform: scale(.997); }
  .drop.on { border-color: var(--primary); background: #eef4ff; }
  .drop .big { font-size: 15px; color: var(--text); margin-bottom: 4px; }
  .drop .formats { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .add-list { margin-top: 14px; }
  .add-item {
    display: flex; align-items: center; gap: 12px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; background: #fff;
  }
  .add-item img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); flex: 0 0 44px; background: #eef0f3; }
  .add-item .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .add-item .nm { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .add-item .sz { font-size: 12px; color: var(--muted); }
  .add-item .rm {
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--border);
    background: #fff; color: var(--muted); font-size: 13px; line-height: 1; cursor: pointer; padding: 0;
  }
  .add-item .rm:hover { border-color: var(--danger); color: var(--danger); background: #fdecea; }

  /* 通用表单 */
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row + .row { margin-top: 14px; }
  .seg { display: inline-flex; gap: 8px; }
  .seg input { display: none; }
  .seg label span {
    display: block; padding: 6px 16px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; color: var(--muted); background: #fff; cursor: pointer;
    transition: background .15s, border-color .15s, color .15s, transform .05s; user-select: none;
  }
  .seg label:hover span { border-color: #c7d0ed; background: #f0f4ff; color: var(--primary); }
  .seg label:active span { transform: scale(.97); }
  .seg input:checked + span { background: var(--primary); border-color: var(--primary); color: #fff; }
  .adv-toggle {
    background: none; border: none; padding: 0; margin: 0;
    color: var(--primary); font-size: 13px; line-height: 1; cursor: pointer;
    font-family: inherit; transition: color .15s; display: inline-flex; align-items: center; gap: 2px;
  }
  .adv-toggle:hover { color: var(--primary-hover); text-decoration: underline; }
  .adv-fields { margin-top: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
  .adv-fields[hidden] { display: none; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .field input {
    width: 120px; padding: 5px 8px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px; color: var(--text);
  }
  .field input:focus { outline: none; border-color: var(--primary); }
  .btns { margin-top: 16px; display: flex; gap: 10px; }

  /* 按钮 */
  .btn {
    font-size: 13px; border: 1px solid var(--border); background: #fff; color: var(--text);
    padding: 7px 16px; border-radius: 6px; cursor: pointer; white-space: nowrap;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: #f0f2f5; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-hover); }
  .btn.sm { padding: 5px 12px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* 状态 */
  .status-line { font-size: 13px; color: var(--muted); margin: 2px 0 14px; }
  .status-line b { color: var(--ok); }

  /* 结果 */
  .result-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; background: #fff;
  }
  .result-item .pick { flex: 0 0 auto; width: 16px; height: 16px; accent-color: var(--primary); }
  .result-item .th { width: 52px; height: 52px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); flex: 0 0 52px; background: #eef0f3; }
  .result-item .info { flex: 1; min-width: 0; }
  .result-item .info .nm { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .result-item .info .meta { font-size: 12px; color: var(--muted); }
  .ratio { font-size: 13px; font-weight: 600; color: var(--ok); white-space: nowrap; margin-left: auto; }
  .rand { margin-left: auto; }
  .tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; }
  .tag.err { background: #fdecea; color: var(--danger); }
  .tag.skip { background: #eef0f3; color: var(--muted); }
  .res-tools { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .res-tools #dlAllBtn { margin-left: auto; }
  code { background: #f0f2f5; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>图片压缩工具</h1>
    <span class="badge" id="envBadge">云端压缩 · 独立服务</span>
  </header>
  <p class="sub">点击或拖拽添加图片，<b>图片会上传至服务器压缩，处理完 2 小时自动删除</b>。</p>

  <!-- 1 添加图片 -->
  <div class="card">
    <h2>1. 添加图片</h2>
    <div class="drop" id="dropzone">
      <div class="big">点击选择图片 / 拖拽图片到此处</div>
      <div class="formats">支持格式：JPG · PNG · WebP · BMP · TIFF（可多选）</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple hidden>
    <div class="add-list" id="addList"></div>
  </div>

  <!-- 2 压缩设置 -->
  <div class="card">
    <h2>2. 压缩设置</h2>
    <div class="row">
      <div class="seg">
        <label><input type="radio" name="mode" value="lossless" checked><span>无损</span></label>
        <label><input type="radio" name="mode" value="lossy"><span>有损</span></label>
      </div>
    </div>
    <div class="row">
      <button type="button" class="adv-toggle" id="advToggle">高级设置 ▾</button>
    </div>
    <div class="adv-fields" id="advFields" hidden>
      <div class="field">初始画质
        <input type="number" id="quality" value="95" min="1" max="100">
      </div>
      <div class="field">目标最小KB
        <input type="number" id="minKb" value="1536" min="0">
      </div>
      <div class="field">目标最大KB
        <input type="number" id="maxKb" value="3072" min="0">
      </div>
      <div class="field">最大边长
        <input type="number" id="maxPixel" value="4096" min="0">
      </div>
    </div>
    <div class="btns">
      <button class="btn primary" id="startBtn">开始压缩</button>
      <button class="btn" id="clearBtn">清空列表</button>
    </div>
  </div>

  <div class="status-line" id="statusLine"></div>

  <!-- 3 压缩结果 -->
  <div class="card hidden" id="resultCard">
    <h2>压缩结果</h2>
    <div id="resultList"></div>
    <div class="res-tools">
      <button class="btn sm" id="selectAllBtn">全选</button>
      <button class="btn sm" id="clearOutBtn">清空</button>
      <button class="btn sm" id="dlAllBtn">批量下载（zip）</button>
    </div>
  </div>

  <p class="sub" style="margin-top:20px">输出文件名保留原格式，形如 <code>xx_compressed.png</code>；<b>压缩结果在服务器保留 2 小时后自动删除</b>。</p>
</div>

<script>
var $ = function (id) { return document.getElementById(id); };

var files = [];   // { file, name, size, dataUrl }

function toast(msg, isErr) {
  var d = document.createElement("div");
  d.style.cssText = "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:" + (isErr ? "#c0392b" : "#1f2329") + ";color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.2)";
  d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(function () { d.remove(); }, 2600);
}

/* ---------- 添加图片 ---------- */
$("dropzone").addEventListener("click", function () { $("fileInput").click(); });
$("dropzone").addEventListener("dragover", function (e) { e.preventDefault(); this.classList.add("on"); });
$("dropzone").addEventListener("dragleave", function () { this.classList.remove("on"); });
$("dropzone").addEventListener("drop", function (e) {
  e.preventDefault(); this.classList.remove("on");
  addFiles(e.dataTransfer.files);
});
$("fileInput").addEventListener("change", function () { addFiles(this.files); this.value = ""; });

function addFiles(list) {
  var added = 0;
  Array.prototype.forEach.call(list, function (f) {
    if (!f.type || f.type.indexOf("image") === -1) return;
    var preview = URL.createObjectURL(f);
    files.push({ file: f, name: f.name, size: f.size, preview: preview });
    added++;
  });
  if (!added) { toast("仅支持图片文件", true); return; }
  renderThumbs();
  updateButtons();
}

function fmtSize(b) {
  if (b >= 1024 * 1024) return (b / 1024 / 1024).toFixed(2) + "MB";
  return (b / 1024).toFixed(1) + "KB";
}

function renderThumbs() {
  var box = $("addList");
  box.innerHTML = "";
  files.forEach(function (f, i) {
    var item = document.createElement("div");
    item.className = "add-item";
    var img = document.createElement("img"); img.src = f.preview; img.alt = "";
    var info = document.createElement("div"); info.className = "info";
    var nm = document.createElement("div"); nm.className = "nm"; nm.textContent = f.name;
    var sz = document.createElement("div"); sz.className = "sz"; sz.textContent = fmtSize(f.size);
    info.append(nm, sz);
    var rm = document.createElement("button"); rm.className = "rm"; rm.textContent = "×";
    rm.addEventListener("click", function () {
      URL.revokeObjectURL(f.preview);
      files.splice(i, 1);
      renderThumbs(); updateButtons();
    });
    item.append(img, info, rm);
    box.appendChild(item);
  });
}

function updateButtons() { $("startBtn").disabled = !files.length; }

$("advToggle").addEventListener("click", function () {
  var fields = $("advFields");
  var open = fields.hidden;
  fields.hidden = !open;
  this.textContent = open ? "高级设置 ▴" : "高级设置 ▾";
});
$("clearBtn").addEventListener("click", function () {
  files.forEach(function (f) { if (f.preview) URL.revokeObjectURL(f.preview); });
  files = []; renderThumbs(); updateButtons();
  $("resultList").innerHTML = ""; $("resultCard").classList.add("hidden");
  toast("已清空");
});

/* ---------- 压缩 ---------- */
$("startBtn").addEventListener("click", function () {
  if (!files.length) return;
  var mode = document.querySelector('input[name="mode"]:checked').value;
  var fd = new FormData();
  files.forEach(function (f) { fd.append("files", f.file, f.name); });
  fd.append("lossy", mode === "lossy" ? "1" : "0");
  fd.append("quality", $("quality").value);
  fd.append("min_kb", $("minKb").value);
  fd.append("max_kb", $("maxKb").value);
  fd.append("max_pixel", $("maxPixel").value);
  $("startBtn").disabled = true;
  $("statusLine").textContent = "正在压缩 …（无损模式较慢，请稍候）";
  toast("正在压缩 …");
  fetch("/tools/upload", { method: "POST", body: fd })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      $("startBtn").disabled = false;
      if (!res.ok) { $("statusLine").textContent = ""; toast(res.error || "压缩出错", true); return; }
      renderResults(res.results);
      var okN = res.results.filter(function (r) { return r.status === "ok"; }).length;
      $("statusLine").textContent = "";
      toast("压缩完成：" + okN + " 张成功");
    })
    .catch(function (e) {
      $("startBtn").disabled = false;
      $("statusLine").textContent = "";
      toast("请求失败：" + e, true);
    });
});

function renderResults(list) {
  $("resultCard").classList.remove("hidden");
  $("resultCard").querySelector("h2").textContent =
    "压缩结果（" + list.filter(function (r) { return r.status === "ok"; }).length + " 张）";
  var box = $("resultList");
  box.innerHTML = "";
  list.forEach(function (r, i) {
    var item = document.createElement("div");
    item.className = "result-item";
    if (r.status === "ok") {
      var cb = document.createElement("input");
      cb.type = "checkbox"; cb.className = "pick"; cb.checked = true;
      cb.setAttribute("data-file-id", r.file_id);
      var img = document.createElement("img"); img.className = "th";
      img.src = "/tools/dl/" + r.file_id;
      var info = document.createElement("div"); info.className = "info";
      var nm = document.createElement("div"); nm.className = "nm"; nm.textContent = r.file;
      var meta = document.createElement("div"); meta.className = "meta";
      meta.textContent = r.out_name + " · " + (r.in_human || "") + " → " + (r.out_human || "") + " · " + (r.quality || "") + (r.mode ? " · " + r.mode : "");
      info.append(nm, meta);
      var ratio = document.createElement("div"); ratio.className = "ratio";
      ratio.textContent = r.ratio && r.ratio < 0 ? "↓" + (-r.ratio).toFixed(0) + "%" : (r.out_size < r.in_size ? "↓" + Math.round((1 - r.out_size / r.in_size) * 100) + "%" : "≈");
      var down = document.createElement("button"); down.className = "btn sm"; down.textContent = "下载";
      down.addEventListener("click", (function (out, nm) {
        return function () { saveFile(out, nm); };
      })(r.file_id, r.out_name));
      item.append(cb, img, info, ratio, down);
    } else {
      var st = document.createElement("span");
      st.className = "tag " + (r.status === "skip" ? "skip" : "err");
      st.textContent = r.msg || (r.status === "skip" ? "已跳过" : "错误");
      item.append(st);
    }
    box.appendChild(item);
  });
}

function saveFile(fileId, name) {
  fetch("/tools/dl/" + fileId)
    .then(function (resp) {
      if (!resp.ok) throw new Error(resp.status === 404 ? "文件不存在，请重新压缩" : "服务器未返回文件");
      return resp.blob();
    })
    .then(function (blob) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name || (blob.name || "压缩结果");
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
    })
    .catch(function (e) { toast("下载失败：" + e.message, true); });
}

$("selectAllBtn").addEventListener("click", function () {
  var cbs = $("resultList").querySelectorAll(".pick");
  if (!cbs.length) { toast("暂无压缩结果", true); return; }
  var all = [].every.call(cbs, function (c) { return c.checked; });
  [].forEach.call(cbs, function (c) { c.checked = !all; });
  toast(all ? "已取消全选" : "已全选");
});

$("dlAllBtn").addEventListener("click", function () {
  var fileIds = [].map.call(
    $("resultList").querySelectorAll(".pick:checked"),
    function (c) { return c.getAttribute("data-file-id"); }
  );
  if (!fileIds.length) { toast("请先勾选要下载的图片", true); return; }
  toast("正在打包 " + fileIds.length + " 张选中图片…");
  fetch("/tools/dl_zip", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ file_ids: fileIds })
  })
    .then(function (resp) {
      if (!resp.ok) throw new Error("服务器返回 " + resp.status);
      return resp.blob();
    })
    .then(function (blob) {
      blob.name = "压缩结果.zip";
      saveLocalBlob(blob, "压缩结果.zip");
      toast("选中图片已打包下载");
    })
    .catch(function (e) { toast("批量下载失败：" + e.message, true); });
});

function saveLocalBlob(blob, name) {
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
}

$("clearOutBtn").addEventListener("click", function () {
  fetch("/tools/clear", { method: "POST" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      $("resultList").innerHTML = ""; $("resultCard").classList.add("hidden");
      toast(d.ok ? "已清空本次压缩结果" : ((d && d.error) || "清空失败"));
    })
    .catch(function (e) { toast("清空失败：" + e, true); });
});

/* 线上版：向独立服务查询能力与限额，并显示在徽标 / 状态行 */
fetch("/tools/info")
  .then(function (r) { return r.json(); })
  .then(function (d) {
    if (!d || !d.ok) return;
    var b = $("envBadge");
    if (b) b.textContent = d.plugins.pngquant ? "云端压缩 · PNG 优化已启用" : "云端压缩 · 独立服务";
    var st = $("statusLine");
    if (st && d.limits) {
      st.textContent = "单张 ≤" + d.limits.max_file_mb + "MB · 单次 ≤" +
        d.limits.max_files_per_request + " 张 · 结果保留 " + d.limits.retention_hours + " 小时后自动删除";
    }
  })
  .catch(function () {});
</script>
</body>
</html>
