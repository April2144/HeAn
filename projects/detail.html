<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目详情 | 禾安</title>
    <meta name="description" content="禾安 - 项目详情">
    <script src="../js/config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = TAILWIND_CONFIG;
    </script>
    <!-- 暗黑模式防闪烁 -->
    <script>
        (function(){try{var t=localStorage.getItem('theme-mode')||'system';var u=new URLSearchParams(location.search).get('theme');var m=(u&&['light','dark','system'].includes(u))?u:t;var d=m==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):m;document.documentElement.classList.toggle('dark',d==='dark')}catch(e){}})();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../js/common.css">
    <link rel="icon" href="data:,">
    <style>
        .project-detail img { transition: transform 0.5s ease; }
        .project-detail img:hover { transform: scale(1.02); }
        .tech-stack-scroll { scrollbar-width: thin; }
        .tech-stack-scroll::-webkit-scrollbar { height: 6px; }
        .tech-stack-scroll::-webkit-scrollbar-track { background: transparent; }
        .tech-stack-scroll::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.4); border-radius: 3px; }
        .tech-card {
            background: linear-gradient(135deg, var(--card-from, #f8fafc), var(--card-to, #f1f5f9));
        }
        .dark .tech-card {
            background: linear-gradient(135deg, var(--card-from, #1e293b), var(--card-to, #0f172a));
        }
    </style>
</head>
<body class="bg-light text-slate-800 dark:bg-dark dark:text-slate-200 font-sans">

    <!-- 顶栏：由 renderNavbar 统一生成（detail 模式） -->
    <header id="navbar"></header>

    <!-- 项目详情 -->
    <main class="project-detail max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-28 pb-20">
        <div class="fade-in-up">
            <div class="rounded-2xl overflow-hidden shadow-xl mb-10">
                <img id="project-image" src="https://picsum.photos/1200/600?dashboard" alt="项目封面" class="w-full object-cover">
            </div>
            <div class="mb-8">
                <h1 class="text-3xl md:text-4xl font-extrabold mb-3" id="project-title">SaaS 仪表盘模板</h1>
                <div class="flex items-center gap-2 text-sm text-slate-500 dark:text-slate-400 mb-4" id="project-meta">
                    <span class="font-medium text-primary" id="project-version">v1.0.0</span>
                    <span class="text-slate-300 dark:text-slate-600">·</span>
                    <span id="project-date">2024-01-01</span>
                </div>
            </div>
            <div class="bg-white dark:bg-slate-800 rounded-xl p-8 shadow-md border border-slate-100 dark:border-slate-700 mb-8">
                <h2 class="text-xl font-bold mb-4 flex items-center"><i class="fas fa-info-circle text-primary mr-2"></i>项目简介</h2>
                <p class="text-lg text-slate-600 dark:text-slate-400 leading-relaxed" id="project-desc">加载中...</p>
            </div>
            <div class="bg-white dark:bg-slate-800 rounded-xl p-8 shadow-md border border-slate-100 dark:border-slate-700 mb-8">
                <h2 class="text-xl font-bold mb-4 flex items-center"><i class="fas fa-star text-yellow-500 mr-2"></i>核心特性</h2>
                <ul class="space-y-3" id="project-features"></ul>
            </div>
            <div id="project-tech-container" class="bg-white dark:bg-slate-800 rounded-xl p-8 shadow-md border border-slate-100 dark:border-slate-700 mb-8" style="display:none;">
                <h2 class="text-xl font-bold mb-4 flex items-center"><i class="fas fa-layer-group text-primary mr-2"></i>技术栈</h2>
                <div class="tech-stack-scroll overflow-x-auto pb-2">
                    <div class="flex gap-3" id="project-tech"></div>
                </div>
            </div>
            <div id="project-screenshots-container" class="bg-white dark:bg-slate-800 rounded-xl p-8 shadow-md border border-slate-100 dark:border-slate-700 mb-8" style="display:none;">
                <h2 class="text-xl font-bold mb-4 flex items-center"><i class="fas fa-images text-primary mr-2"></i>项目截图</h2>
                <div class="tech-stack-scroll overflow-x-auto pb-2">
                    <div class="flex gap-4" id="project-screenshots"></div>
                </div>
            </div>
            <div class="flex flex-col sm:flex-row gap-4 mb-10" id="project-links-container">
                <a id="project-demo-link" href="#" target="_blank" class="flex-1 flex items-center justify-center gap-2 px-6 py-3 rounded-lg bg-primary text-white font-medium hover:bg-blue-600 transition-all shadow-lg hover:shadow-blue-500/30"><i class="fas fa-external-link-alt"></i> 在线预览</a>
                <a id="project-source-link" href="#" target="_blank" class="flex-1 flex items-center justify-center gap-2 px-6 py-3 rounded-lg border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all"><i class="fab fa-github"></i> 源码仓库</a>
            </div>
            <!-- 公众号二维码 -->
            <div id="public-account-section" style="display:none;"></div>
        </div>
    </main>

    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-12"></footer>

    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/views.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        initApp('projects', { type: 'detail' });
        HeAnAuth.mountLoginButton();

        async function renderProjectDetail() {
            const projectId = new URLSearchParams(location.search).get('id') || '0';
            const project = await loadProject(projectId);
            if (!project) return;

            document.title = `${project.title} | ${SITE.name}`;
            document.getElementById('project-image').src = project.cover_image;
            document.getElementById('project-image').alt = project.title;
            document.getElementById('project-title').textContent = project.title;
            document.getElementById('project-desc').textContent = project.description;

            // 版本号 · 发布日期（只要年月日），版本号默认 V1.0.0
            const versionStr = project.version ? project.version : 'V1.0.0';
            const dateStr = project.published_at ? project.published_at.slice(0, 10) : (project.created_at ? project.created_at.slice(0, 10) : '');
            const metaEl = document.getElementById('project-meta');
            const versionEl = document.getElementById('project-version');
            const dateEl = document.getElementById('project-date');
            versionEl.textContent = versionStr;
            versionEl.style.display = '';
            if (dateStr) {
                dateEl.textContent = dateStr;
                dateEl.style.display = '';
                metaEl.style.display = '';
            } else {
                dateEl.style.display = 'none';
                metaEl.style.display = '';
            }

            // 核心特性
            document.getElementById('project-features').innerHTML = (project.features || []).map(f =>
                `<li class="flex items-start"><i class="fas fa-check-circle text-secondary mt-1 mr-3"></i><span class="text-slate-600 dark:text-slate-400">${f}</span></li>`
            ).join('');

            // 技术栈（用 tags 数据作为技术栈展示，card 列表水平布局）
            const tags = project.tags || [];
            if (tags.length > 0) {
                document.getElementById('project-tech').innerHTML = tags.map(tag =>
                    `<div class="tech-card flex-shrink-0 px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-700 shadow-sm">
                        <span class="text-sm font-medium text-slate-700 dark:text-slate-300">${tag}</span>
                    </div>`
                ).join('');
                document.getElementById('project-tech-container').style.display = '';
            }

            // 项目截图（card 列表水平布局）
            if (project.screenshots && project.screenshots.length > 0) {
                document.getElementById('project-screenshots').innerHTML = project.screenshots.map(url =>
                    `<img src="${url}" alt="项目截图" class="w-64 aspect-[16/9] object-cover rounded-lg flex-shrink-0 shadow-sm" onerror="this.style.display='none'">`
                ).join('');
                document.getElementById('project-screenshots-container').style.display = '';
            }

            // 演示链接/源码链接：无URL时隐藏
            const demoLink = document.getElementById('project-demo-link');
            const sourceLink = document.getElementById('project-source-link');
            const linksContainer = document.getElementById('project-links-container');
            const hasDemo = project.demo_url && project.demo_url !== '#' && project.demo_url.trim() !== '';
            const hasSource = project.source_url && project.source_url !== '#' && project.source_url.trim() !== '';
            demoLink.style.display = hasDemo ? 'flex' : 'none';
            sourceLink.style.display = hasSource ? 'flex' : 'none';
            if (hasDemo) demoLink.href = project.demo_url;
            if (hasSource) sourceLink.href = project.source_url;
            linksContainer.style.display = (hasDemo || hasSource) ? '' : 'none';

            // 展示公众号二维码（如果 show_public_account 开启）
            (async () => {
                const profileData = await loadProfile();
                const about = (profileData && profileData.about) ? profileData.about : null;
                const contacts = (about && about.contacts) ? about.contacts : {};
                const publicAccountSection = document.getElementById('public-account-section');
                if (publicAccountSection && project.show_public_account && contacts && contacts.mp_qrcode) {
                    publicAccountSection.innerHTML = `
                        <div class="mt-10 pt-8 border-t border-slate-200 dark:border-slate-700 text-center">
                            <h3 class="font-bold mb-4">关注公众号</h3>
                            <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">获取独家技术资料、源码下载权限及最新独立开发咨询</p>
                            <div class="w-48 h-48 bg-slate-100 dark:bg-slate-700 rounded-lg overflow-hidden mx-auto">
                                <img src="${contacts.mp_qrcode}" alt="公众号二维码" class="w-full h-full object-cover">
                            </div>
                            ${contacts.mp_name ? '<p class="mt-4 text-slate-700 dark:text-slate-300 font-bold">扫码关注「' + contacts.mp_name + '」</p>' : ''}
                            <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">回复"资料"获取独家技术资料</p>
                        </div>
                    `;
                    publicAccountSection.style.display = '';
                }
            })();
        }
        // 返回上级页面：根据来源智能返回，保持与专题/博客详情页一致
        function goBack() {
            const from = new URLSearchParams(location.search).get('from');
            if (from === 'home') {
                window.history.back();
            } else if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }
        renderProjectDetail();
    </script>
</body>
</html>
