<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目详情 | 禾安</title>
    <meta name="description" content="禾安 - 项目详情">
    <script src="../js/config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = TAILWIND_CONFIG;
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../js/common.css">
    <style>.project-detail img { transition: transform 0.5s ease; } .project-detail img:hover { transform: scale(1.02); }</style>
</head>
<body class="bg-light text-slate-800 dark:bg-dark dark:text-slate-200 transition-colors duration-300 font-sans">

    <!-- 详情页顶栏：面包屑(左) + 返回(右)，无主导航 -->
    <header class="sticky top-0 z-50 bg-white/80 dark:bg-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
            <nav class="flex items-center space-x-2 text-sm text-slate-500">
                <span class="text-slate-400" id="breadcrumb-from">首页</span>
                <i class="fas fa-chevron-right text-xs"></i>
                <span class="text-slate-800 dark:text-slate-200" id="breadcrumb-title">项目详情</span>
            </nav>
            <button id="btn-back" class="flex items-center gap-1.5 text-sm text-primary font-medium hover:underline">
                <i class="fas fa-arrow-left text-xs"></i> 返回
            </button>
        </div>
    </header>

    <!-- 项目详情 -->
    <main class="project-detail max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-20">
        <div class="fade-in-up">
            <div class="rounded-2xl overflow-hidden shadow-xl mb-10">
                <img id="project-image" src="https://picsum.photos/1200/600?dashboard" alt="项目封面" class="w-full object-cover">
            </div>
            <div class="mb-8">
                <h1 class="text-3xl md:text-4xl font-extrabold mb-4" id="project-title">SaaS 仪表盘模板</h1>
                <div class="flex flex-wrap gap-2 mb-4" id="project-tags">
                    <span class="text-xs font-semibold px-3 py-1 bg-blue-100 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 rounded-full">React</span>
                    <span class="text-xs font-semibold px-3 py-1 bg-blue-100 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 rounded-full">Tailwind</span>
                </div>
            </div>
            <div class="bg-white dark:bg-slate-800 rounded-xl p-8 shadow-md border border-slate-100 dark:border-slate-700 mb-8">
                <h2 class="text-xl font-bold mb-4 flex items-center"><i class="fas fa-info-circle text-primary mr-2"></i>项目简介</h2>
                <p class="text-lg text-slate-600 dark:text-slate-400 leading-relaxed" id="project-desc">加载中...</p>
            </div>
            <div class="bg-white dark:bg-slate-800 rounded-xl p-8 shadow-md border border-slate-100 dark:border-slate-700 mb-8">
                <h2 class="text-xl font-bold mb-4 flex items-center"><i class="fas fa-star text-yellow-500 mr-2"></i>核心特性</h2>
                <ul class="space-y-3" id="project-features"></ul>
            </div>
            <div class="bg-white dark:bg-slate-800 rounded-xl p-8 shadow-md border border-slate-100 dark:border-slate-700 mb-8">
                <h2 class="text-xl font-bold mb-4 flex items-center"><i class="fas fa-layer-group text-primary mr-2"></i>技术栈</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="project-tech-stack">
                    <div class="text-center p-4 bg-slate-50 dark:bg-slate-700/50 rounded-lg"><i class="fab fa-react text-3xl text-blue-500 mb-2"></i><p class="text-sm font-medium">React 18</p></div>
                    <div class="text-center p-4 bg-slate-50 dark:bg-slate-700/50 rounded-lg"><i class="fab fa-css3-alt text-3xl text-cyan-500 mb-2"></i><p class="text-sm font-medium">Tailwind CSS</p></div>
                    <div class="text-center p-4 bg-slate-50 dark:bg-slate-700/50 rounded-lg"><i class="fas fa-chart-bar text-3xl text-green-500 mb-2"></i><p class="text-sm font-medium">ECharts</p></div>
                    <div class="text-center p-4 bg-slate-50 dark:bg-slate-700/50 rounded-lg"><i class="fas fa-code text-3xl text-purple-500 mb-2"></i><p class="text-sm font-medium">TypeScript</p></div>
                </div>
            </div>
            <div class="flex flex-col sm:flex-row gap-4 mb-10">
                <a id="project-demo-link" href="#" target="_blank" class="flex-1 flex items-center justify-center gap-2 px-6 py-3 rounded-lg bg-primary text-white font-medium hover:bg-blue-600 transition-all shadow-lg hover:shadow-blue-500/30"><i class="fas fa-external-link-alt"></i> 在线预览</a>
                <a id="project-source-link" href="#" target="_blank" class="flex-1 flex items-center justify-center gap-2 px-6 py-3 rounded-lg border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all"><i class="fab fa-github"></i> 源码仓库</a>
            </div>
        </div>
    </main>

    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-12"></footer>

    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/views.js"></script>
    <script src="../js/theme.js"></script>
    <script>
        // 不调用 initApp，详情页不渲染主导航栏
        initTheme();

        // 根据 from 参数决定面包屑和返回目标
        const params = new URLSearchParams(window.location.search);
        const from = params.get('from') || 'projects';
        const fromLabel = from === 'home' ? '首页' : '项目列表';
        const backUrl = from === 'home' ? '../index.html#projects' : 'index.html';
        document.getElementById('breadcrumb-from').innerHTML = from === 'home'
            ? '<a href="../index.html#projects" class="hover:text-primary transition-colors"><i class="fas fa-home mr-1"></i>首页</a>'
            : '<a href="index.html" class="hover:text-primary transition-colors">项目列表</a>';
        document.getElementById('btn-back').addEventListener('click', () => { window.location.href = backUrl; });

        async function renderProjectDetail() {
            const projectId = params.get('id') || '0';
            const project = await loadProject(projectId);
            if (!project) return;

            document.getElementById('breadcrumb-title').textContent = project.title;
            document.title = `${project.title} | ${SITE.name}`;
            document.getElementById('project-image').src = project.cover_image;
            document.getElementById('project-image').alt = project.title;
            document.getElementById('project-title').textContent = project.title;
            document.getElementById('project-desc').textContent = project.description;
            document.getElementById('project-tags').innerHTML = (project.tags || []).map(tag =>
                `<span class="text-xs font-semibold px-3 py-1 bg-blue-100 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 rounded-full">${tag}</span>`
            ).join('');
            document.getElementById('project-features').innerHTML = project.features.map(f =>
                `<li class="flex items-start"><i class="fas fa-check-circle text-secondary mt-1 mr-3"></i><span class="text-slate-600 dark:text-slate-400">${f}</span></li>`
            ).join('');

            const techStackEl = document.getElementById('project-tech-stack');
            techStackEl.innerHTML = project.tags.map(tag => {
                const tech = TECH_ICONS[tag] || { icon: 'fas fa-code', color: 'text-slate-500' };
                return `<div class="text-center p-4 bg-slate-50 dark:bg-slate-700/50 rounded-lg"><i class="${tech.icon} text-3xl ${tech.color} mb-2"></i><p class="text-sm font-medium">${tag}</p></div>`;
            }).join('');

            document.getElementById('project-demo-link').href = project.demo_url;
            document.getElementById('project-source-link').href = project.source_url;
        }
        renderProjectDetail();
    </script>
</body>
</html>
