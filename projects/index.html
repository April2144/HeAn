<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品 | 禾安</title>
    <meta name="description" content="禾安的产品展示：能用、能下载的东西">
    <!-- SEO：规范链接 + 分享卡片（静态写死 ✓） -->
    <link rel="canonical" href="https://hacore.cn/projects/">
    <meta property="og:site_name" content="禾安">
    <meta property="og:type" content="website">
    <meta property="og:title" content="产品 | 禾安">
    <meta property="og:description" content="禾安的产品展示：能用、能下载的东西">
    <meta property="og:url" content="https://hacore.cn/projects/">
    <meta property="og:image" content="https://hacore.cn/assets/img/og-cover.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="产品 | 禾安">
    <meta name="twitter:description" content="禾安的产品展示：能用、能下载的东西">
    <meta name="twitter:image" content="https://hacore.cn/assets/img/og-cover.png">
    <!-- 暗黑模式防闪烁 -->
    <script>
        (function(){try{var t=localStorage.getItem('theme-mode')||'system';var u=new URLSearchParams(location.search).get('theme');var m=(u&&['light','dark','system'].includes(u))?u:t;var d=m==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):m;document.documentElement.classList.toggle('dark',d==='dark')}catch(e){}})();
    </script>
    <script src="../js/config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = TAILWIND_CONFIG;</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../js/common.css?v=20260921d">
    <link rel="icon" href="/assets/logo-mark.svg">
</head>
<body class="bg-light text-slate-800 dark:bg-dark dark:text-slate-200 font-sans">

    <!-- 导航栏：由 renderNavbar 统一生成 -->
    <nav id="navbar"></nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-28 pb-20" id="projects-page">
        <!-- 内容由 JS 按分类动态生成 -->
    </main>

    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-12">
        <!-- ⚠️ 无 JS 时的静态回退（站点名 + 备案号）：爬虫不执行 JS，必须静态可读 ✓
             JS 加载后由 renderFooter() 整体替换 → 真实用户看到的仍是原页脚 ✓ 内容由 gen_static.py 同步，勿手改 ✗ -->
        <div id="filing-static" class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 leading-relaxed">
            <p>禾安的笔记</p>
            <p><a href="https://beian.miit.gov.cn" rel="noopener">豫ICP备2026043016号</a> · <a href="https://beian.mps.gov.cn/#/query/webSearch?code=41018302000609" rel="noopener">豫公网安备41018302000609号</a></p>
        </div>
    </footer>

    <script src="../js/utils.js"></script>
    <script src="../vendor/localforage.min.js"></script>
    <script src="../js/api.js?v=20260921c"></script>
    <script src="../js/views.js?v=20260921c"></script>
    <script src="../js/theme.js?v=20260921d"></script>
    <script src="../js/auth.js?v=20260921e"></script>
    <!-- Tiptap JSON 文档模型渲染层（正文标准渲染路径） -->
    <script src="../js/renderer.js"></script>
    <script>
        initApp('projects', { type: 'main' });

        async function renderProjectsPage() {
            const data = await loadProjects();
            if (!data) return;
            const page = document.getElementById('projects-page');

            const projects = data.projects || [];

            // 完全没有项目数据：渲染整页空态（与专题页空态样式布局保持一致）
            if (projects.length === 0) {
                renderPageEmptyState(page, {
                    icon: 'fa-rocket',
                    title: '产品开发中，敬请期待',
                    description: '第一个产品正在路上。',
                    links: [
                        { href: navHref('topics/index.html'), label: '专题' },
                        { href: navHref('blog/index.html'), label: '博客文章' },
                    ],
                });
                return;
            }

            // 项目分区图标映射（与博客 groupIcons 一致，缺省用文件夹图标）
            const projectIcons = {
                '个人项目': 'fa-user',
                '合作项目': 'fa-handshake',
            };
            function iconForGroup(name) {
                return projectIcons[name] || 'fa-folder';
            }

            // 按 group 动态分区（保持原网格样式，UI 布局不变）
            const order = [];
            const byGroup = {};
            projects.forEach(p => {
                const g = p.group || '未分组';
                if (!byGroup[g]) { byGroup[g] = []; order.push(g); }
                byGroup[g].push(p);
            });

            function renderSection(title, icon, items) {
                if (!items.length) return '';
                return `
                    <div class="mb-16 fade-in-up">
                        <div class="flex items-center gap-3 mb-8">
                            <i class="fas ${icon} text-primary text-xl"></i>
                            <h2 class="text-2xl font-bold">${title}</h2>
                            <span class="text-sm text-slate-400">${items.length} 个产品</span>
                        </div>
                        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                            ${items.map(project => {
                                // 按平台类型决定跳转：app→商店链接，web→网站链接，都没有则进详情页
                                const link = resolveProjectLink(project, `${project.id}/?from=projects`);
                                return `
                                <a href="${link.href}"${link.external ? ' target="_blank" rel="noopener"' : ''} class="block group">
                                    <article class="card-hover bg-white dark:bg-slate-800 rounded-xl overflow-hidden border border-slate-100 dark:border-slate-700 h-full">
                                        <div class="overflow-hidden aspect-[16/9]" style="aspect-ratio:16/9">
                                            <img src="${project.cover_image}" alt="${project.title}" class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-500" style="object-fit:cover;object-position:center">
                                        </div>
                                        <div class="p-6">
                                            <div class="flex flex-wrap gap-2 mb-3">
                                                ${getTagListHtml(project.tags)}
                                            </div>
                                            <h3 class="text-xl font-bold mb-2 group-hover:text-primary transition-theme-color">${project.title}</h3>
                                            <p class="text-slate-600 dark:text-slate-400 text-sm mb-4 line-clamp-2">${tiptapJsonToPlainText(parseTiptapJson(project.description)).slice(0, 60) || '暂无描述'}</p>
                                        </div>
                                    </article>
                                </a>
                            `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }

            page.innerHTML = order.map(g => renderSection(g, iconForGroup(g), byGroup[g])).join('');
        }
        // renderProjectsPage 为 async：await 并捕获异常
        (async () => {
            try {
                await renderProjectsPage();
            } catch (e) {
                console.error('[projects] 渲染失败:', e);
            }
        })();
    </script>
    <!-- 百度「自动推送」：页面被访问时自动把 URL 推送给百度，加速收录 -->
    <script>
    (function () {
        var bp = document.createElement('script');
        var protocol = window.location.protocol.split(':')[0];
        // https 与 http 使用不同的推送地址（官方要求）
        bp.src = protocol === 'https'
            ? 'https://zz.bdstatic.com/linksubmit/push.js'
            : 'http://push.zhanzhang.baidu.com/push.js';
        var first = document.getElementsByTagName('script')[0];
        first.parentNode.insertBefore(bp, first);
    })();
    </script>
</body>
</html>
