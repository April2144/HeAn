<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目作品 | 禾安</title>
    <meta name="description" content="禾安的项目作品展示">
    <!-- 暗黑模式防闪烁 -->
    <script>
        (function(){try{var t=localStorage.getItem('theme-mode')||'system';var u=new URLSearchParams(location.search).get('theme');var m=(u&&['light','dark','system'].includes(u))?u:t;var d=m==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):m;document.documentElement.classList.toggle('dark',d==='dark')}catch(e){}})();
    </script>
    <script src="../js/config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = TAILWIND_CONFIG;</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../js/common.css">
    <link rel="icon" href="data:,">
</head>
<body class="bg-light text-slate-800 dark:bg-dark dark:text-slate-200 font-sans">

    <!-- 导航栏：由 renderNavbar 统一生成 -->
    <nav id="navbar"></nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-28 pb-20" id="projects-page">
        <!-- 内容由 JS 按分类动态生成 -->
    </main>

    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-12"></footer>

    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/views.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        initApp('projects', { type: 'main' });

        async function renderProjectsPage() {
            const data = await loadProjects();
            if (!data) return;
            const page = document.getElementById('projects-page');

            const projects = data.projects || [];

            // 项目分区图标映射（与博客 groupIcons 一致，缺省用文件夹图标）
            const projectIcons = {
                '个人项目': 'fa-user',
                '合作项目': 'fa-handshake',
            };
            function iconForGroup(name) {
                return projectIcons[name] || 'fa-folder';
            }

            // 按 group 动态分区（保持原网格样式，UI 布局不变）
            const order = [];
            const byGroup = {};
            projects.forEach(p => {
                const g = p.group || '未分组';
                if (!byGroup[g]) { byGroup[g] = []; order.push(g); }
                byGroup[g].push(p);
            });

            function renderSection(title, icon, items) {
                if (!items.length) return '';
                return `
                    <div class="mb-16 fade-in-up">
                        <div class="flex items-center gap-3 mb-8">
                            <i class="fas ${icon} text-primary text-xl"></i>
                            <h2 class="text-2xl font-bold">${title}</h2>
                            <span class="text-sm text-slate-400">${items.length} 个项目</span>
                        </div>
                        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                            ${items.map(project => `
                                <a href="detail.html?id=${project.id}&from=projects" class="block group">
                                    <article class="card-hover bg-white dark:bg-slate-800 rounded-xl overflow-hidden border border-slate-100 dark:border-slate-700 h-full">
                                        <div class="overflow-hidden aspect-[16/9]">
                                            <img src="${project.cover_image}" alt="${project.title}" class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-500">
                                        </div>
                                        <div class="p-6">
                                            <div class="flex flex-wrap gap-2 mb-3">
                                                ${getTagListHtml(project.tags)}
                                            </div>
                                            <h3 class="text-xl font-bold mb-2 group-hover:text-primary transition-theme-color">${project.title}</h3>
                                            <p class="text-slate-600 dark:text-slate-400 text-sm mb-4 line-clamp-2">${project.description}</p>
                                        </div>
                                    </article>
                                </a>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            page.innerHTML = order.map(g => renderSection(g, iconForGroup(g), byGroup[g])).join('');
        }
        renderProjectsPage();
    </script>
</body>
</html>
