<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专题领域 | 禾安</title>
    <meta name="description" content="禾安 - 系统化学习专题，构建完整知识体系">
    <!-- 暗黑模式防闪烁 -->
    <script>
        (function(){try{var t=localStorage.getItem('theme-mode')||'system';var u=new URLSearchParams(location.search).get('theme');var m=(u&&['light','dark','system'].includes(u))?u:t;var d=m==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):m;document.documentElement.classList.toggle('dark',d==='dark')}catch(e){}})();
    </script>
    <script src="../js/config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = TAILWIND_CONFIG;
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tiptap JSON 文档模型渲染层（产品推荐描述、正文渲染依赖 parseTiptapJson/tiptapJsonToPlainText/renderContent） -->
    <script src="../js/renderer.js"></script>
    <link rel="stylesheet" href="../js/common.css">
    <link rel="icon" href="data:,">
</head>
<body class="bg-light text-slate-800 dark:bg-dark dark:text-slate-200 font-sans">

    <!-- 导航栏：由 renderNavbar 统一生成 -->
    <nav id="navbar"></nav>

    <!-- 专题列表区域 -->
    <section class="pb-20 pt-28">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-left">
            <div class="flex flex-col lg:flex-row gap-10">
                <!-- 左侧侧边栏：搜索框 + 技术栈（顶部）、热门专题、产品推荐 -->
                <aside class="lg:w-64 flex-shrink-0 order-2 lg:order-1">
                    <div class="sticky top-28 space-y-8">
                        <!-- 搜索框 + 技术栈（置于侧边栏顶部） -->
                        <div id="topic-search" class="max-w-7xl"></div>
                        <div id="topic-tags" class="topic-tags">
                            <div class="topic-tags-title">技术栈筛选</div>
                        </div>

                        <!-- 热门专题区（简单标题 + 简介列表） -->
                        <div id="topics" class="topic-side-block">
                            <h2 class="text-xl font-bold mb-4">热门专题</h2>
                            <ul id="topics-list" class="topic-simple-list"></ul>
                        </div>

                        <!-- 产品推荐（简单产品名 + 介绍列表） -->
                        <div id="projects" class="topic-side-block">
                            <h2 class="text-xl font-bold mb-4">产品推荐</h2>
                            <ul id="projects-list" class="topic-simple-list"></ul>
                        </div>
                    </div>
                </aside>

                <!-- 右侧：专题卡片列表 -->
                <div class="flex-1 min-w-0 order-1 lg:order-2">
                    <!-- 专题卡片列表（4 列网格） -->
                    <div id="series-list" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4"></div>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-12"></footer>

    <!-- JS -->
    <!-- localforage：离线缓存层依赖（与首页统一使用本地 vendor，离线可用；CDN 不可用时 api.js 自动降级） -->
    <script src="../vendor/localforage.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/views.js"></script>
    <script src="../js/topics.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        initApp('topics', { type: 'main' });
        loadTopicsPage();
    </script>
</body>
</html>
